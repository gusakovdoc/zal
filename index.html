}
/* Оценка упражнения за тренировку — среднее по рабочим подходам, а не лучший
   из них. По лучшему выгодно вложиться в первый подход и слить остальные, а
   растит результат как раз обратное. Среднее не зависит от числа подходов:
   четвёртый подход не поднимет рекорд просто фактом своего наличия. */
function exScore(sets,m){
  var s=0,n=0;
  (sets||[]).forEach(function(x){
    if(!x||!x.d)return;
    var q=setScore(x.w,x.r,m);
    if(q>0){s+=q;n++;}
  });
  return n?s/n:0;
}
function bestEver(exId){
  var m=EX[exId];if(!m)return 0;
  var b=0;
  S.log.forEach(function(x){var q=exScore(x.e[exId],m);if(q>b)b=q;});
  return b;
}

/* Сколько сделано на этой неделе по каждому пункту плана */
function planDone(k,wk){
  wk=wk||weekKey(Date.now());
  return S.log.filter(function(x){
    if(weekKey(x.s)!==wk)return false;
    if(k==='gym')return (x.type||DAYS[x.day].type)==='gym';
    return x.day===k;
  }).length;
}
function typeOf(x){return x.type||(DAYS[x.day]?DAYS[x.day].type:'home');}
function homeNeed(p){return p.mob+p.core+p.wheel+p.prio+p.elbow;}
/* Текущая и будущие недели живут по актуальному плану, прошлые — по снимку,
   сделанному, пока неделя ещё шла. Поэтому правка плана сегодня не может
   переоценить задним числом уже прожитую неделю. */
function planFor(wk){
  if(S.bad[wk])return PLANMIN;
  if(wk>=weekKey(Date.now()))return S.plan;
  return S.planHist[wk]||S.plan;
}
function freezePlan(wk){
  var p=copy(S.plan);
  Object.keys(PLAN0).forEach(function(k){if(p[k]===undefined)p[k]=PLAN0[k];});
  S.planHist[wk]=p;
}
/* Недели, прожитые до появления заморозки, снимка не имеют — из-за этого их
   статус пересчитывался при каждой правке плана. Закрепляем их один раз
   текущим планом: другого достоверного значения для прошлого уже нет. */
function backfillPlans(){
  var cur=weekKey(Date.now()),seen={},changed=false;
  S.log.forEach(function(x){seen[weekKey(x.s)]=1;});
  Object.keys(seen).map(Number).forEach(function(wk){
    if(wk>=cur||S.planHist[wk])return;
    freezePlan(wk);changed=true;
  });
  return changed;
}

/* ---- Калории ----
   MET — метаболический эквивалент: во сколько раз расход выше покоя.
   ккал = MET × вес × часы. Значения из компендиума Ainsworth. */
var MET={A:5,B:5,mob:2.3,core:3.5,wheel:4,prio:4.5,elbow:2,padel:6.5};
function minsOf(x){return Math.max(1,Math.round((x.f-x.s)/60000));}
function metKcal(dayKey,mins,w){return Math.round((MET[dayKey]||3.5)*(w||bodyW())*(mins/60));}
/* Нагрудный пульсометр систематически завышает падел: между розыгрышами пульс
   остаётся высоким, а потребление кислорода за ним не идёт, и прибор считает
   эту паузу нагрузкой. Практическая поправка для ракеточных видов — около 0,78.
   Результат подстраховываем физиологической оценкой по MET. */
function padelKcal(raw,mins,w){
  w=w||bodyW();
  var met=Math.round(6.5*w*(mins/60));
  if(!raw)return met;
  var c=Math.round(raw*0.78),lo=Math.round(met*0.7),hi=Math.round(met*1.5);
  return c<lo?lo:(c>hi?hi:c);
}
function kcalOf(x){
  var t=typeOf(x),mins=minsOf(x);
  if(t==='padel')return padelKcal(x.kcalRaw||0,mins,x.bw);
  if(x.kcal)return x.kcal;
  return metKcal(x.day,mins,x.bw);
}
function weekKcal(wk){
  return S.log.filter(function(x){return weekKey(x.s)===wk;}).reduce(function(a,x){return a+kcalOf(x);},0);
}
/* Последнее значение поля тела на конец недели wk */
function bodyAt(wk,key){
  var end=wk+7*864e5;
  var r=S.body.filter(function(x){return new Date(x.d).getTime()<end&&x[key]!==undefined&&x[key]!=='';})
              .sort(function(a,b){return a.d<b.d?-1:1;});
  return r.length?r[r.length-1][key]:null;
}
/* ---- Питание ----
   Режим набора. Быстрый набор действительно уводит часть прироста в жир, но
   у того, кому вес даётся тяжело, слишком осторожный избыток просто не даёт
   роста вообще — а лишний жир снимается обратно куда легче, чем строится
   мышца. Поэтому по умолчанию режим с запасом. */
var GAIN={
 easy:{s:200,fast:0.30,slow:0.12,n:'Осторожный',d:'минимум жира, набор медленный'},
 norm:{s:320,fast:0.40,slow:0.15,n:'Обычный',    d:'цель около +0,25 кг в неделю'},
 hard:{s:520,fast:0.60,slow:0.25,n:'С запасом',  d:'набор идёт тяжело — держим избыток заведомо выше нужного'}
};
var HGT=180,AGE=35,KCAL_PER_KG=7700;
function bmr(w){return Math.round(10*w+6.25*HGT-5*AGE+5);}
function nutrition(wk){
  var w=bodyAt(wk,'w')||bodyW();
  var ss=S.log.filter(function(x){return weekKey(x.s)===wk;});
  var train=ss.reduce(function(a,x){return a+kcalOf(x);},0);
  var perDay=Math.round(train/7);
  /* Шаги, набитые на корте, уже посчитаны в калориях падела — вычитаем,
     иначе один и тот же час игры учтётся дважды. ~3500 шагов за час игры. */
  var padMin=ss.filter(function(x){return typeOf(x)==='padel';}).reduce(function(a,x){return a+minsOf(x);},0);
  var stepsRaw=bodyAt(wk,'st')||0;
  var padSteps=Math.round(padMin/60*3500/7);
  var steps=Math.max(0,stepsRaw-padSteps);
  var base=Math.round(bmr(w)*1.2);
  var stepK=Math.round(Math.max(0,steps-2000)*0.0004*w);
  var tdee=base+stepK+perDay;
  /* Каждая запись веса — среднее ежедневных утренних взвешиваний за неделю,
     поэтому разница между двумя записями уже очищена от суточных колебаний
     воды и гликогена и годится для оценки темпа напрямую. */
  var wp=S.body.filter(function(x){return x.w&&new Date(x.d).getTime()<wk+7*864e5;})
               .sort(function(a,b){return a.d<b.d?-1:1;});
  var rate=null,rateWks=0,idxB=0;
  if(wp.length>=2){
    idxB=wp.length>=5?wp.length-5:0;
    var a=wp[wp.length-1],b=wp[idxB];
    var weeks=Math.max(1,(new Date(a.d)-new Date(b.d))/6048e5);
    rate=Math.round((a.w-b.w)/weeks*100)/100;
    rateWks=Math.round(weeks*10)/10;
  }
  /* Съеденное по факту. Если известно и оно, и как за тот же период менялся
     вес, расход считается напрямую: съел минус то, что осело в набор. Это
     измерение, а не формула, поэтому оно всегда важнее расчётного. */
  var win=wp.slice(idxB).filter(function(x){return x.kc;});
  var eaten=win.length?Math.round(win.reduce(function(s,x){return s+x.kc;},0)/win.length):null;
  var tdeeReal=(eaten!==null&&rate!==null)?Math.round(eaten-rate*KCAL_PER_KG/7):null;
  var G=GAIN[S.gain]||GAIN.hard;
  var surplus=G.s,why=G.d;
  if(rate!==null){
    if(rate>G.fast){surplus=Math.round(G.s*0.55);why='вес растёт быстрее '+fmtW(G.fast)+' кг в неделю — даже с запасом это уже много, срезаем';}
    else if(rate<G.slow*0.4){surplus=Math.round(G.s*1.5);why='вес практически стоит — избытка не хватает, добавляем ощутимо';}
    else if(rate<G.slow){surplus=Math.round(G.s*1.25);why='темп ниже целевого — избыток увеличен';}
    else why='темп в целевом коридоре, избыток держим';
  }
  /* Измеренный расход бьёт расчётный: формула Миффлина и MET-таблицы дают
     ±15%, а связка «сколько съел — насколько вырос» ошибается только на
     точности весов и дневника. */
  var tdeeUse=(tdeeReal!==null)?tdeeReal:tdee;
  var target=tdeeUse+surplus;
  var prot=Math.round(1.8*w),fat=Math.round(0.9*w);
  var carb=Math.max(0,Math.round((target-prot*4-fat*9)/4));
  return{w:w,bmr:bmr(w),base:base,steps:steps,stepsRaw:stepsRaw,padSteps:padSteps,stepK:stepK,
         train:train,perDay:perDay,tdee:tdee,tdeeReal:tdeeReal,tdeeUse:tdeeUse,eaten:eaten,
         surplus:surplus,why:why,target:target,
         rate:rate,rateWks:rateWks,weighIns:wp.length,prot:prot,fat:fat,carb:carb};
}
function nutriAdvice(N,wk){
  var t=[],back=wk-4*7*864e5;
  if(N.eaten!==null&&N.tdeeReal!==null){
    var d=N.target-N.eaten;
    t.push('Расход посчитан по факту, а не по формуле: ел '+N.eaten+' ккал в день и рос на '+(N.rate>=0?'+':'')+fmtW(N.rate)+' кг в неделю — значит удерживает вес '+N.tdeeReal+'. Формула давала '+N.tdee+', разница '+(N.tdeeReal>N.tdee?'+':'')+(N.tdeeReal-N.tdee)+'.');
    if(d>80) t.push('До цели не хватает '+d+' ккал в день. Проще всего добрать углеводами: '+Math.round(d/4)+' г — это примерно '+fmtW(Math.round(d/4/0.75)/10*10)+' г риса или овсянки в сухом виде.');
    else if(d<-80) t.push('Ешь на '+Math.abs(d)+' ккал больше цели. Если талия при этом не растёт — не трогай, значит расход выше расчётного.');
    else t.push('Съедаемое совпадает с целью — так и держи.');
  }else if(N.eaten!==null){
    t.push('Съедаемое известно ('+N.eaten+' ккал), но нужен ещё один замер веса, чтобы посчитать реальный расход. После него цифра перестанет быть оценкой.');
  }else{
    t.push('Заполни «Съедено, ккал в день» во вкладке «Тело» — вместе с весом это даст измеренный расход вместо расчётного, и точность вырастет заметно.');
  }
  if(!N.stepsRaw) t.push('Шаги за эту неделю не заполнены, поэтому расчётный расход занижен. Впиши среднее из часов во вкладке «Тело».');
  if(N.rate===null) t.push('Нужно хотя бы два воскресных замера веса, чтобы поймать темп. Пока держу избыток по умолчанию.');
  else t.push('Фактический темп: '+(N.rate>=0?'+':'')+fmtW(N.rate)+' кг в неделю, по '+N.weighIns+' замерам за '+fmtW(N.rateWks)+' нед. Режим «'+(GAIN[S.gain]||GAIN.hard).n+'»: тревога начинается выше '+fmtW((GAIN[S.gain]||GAIN.hard).fast)+' кг в неделю.');

  var wa1=bodyAt(wk,'wa'),wa0=bodyAt(back,'wa'),bi1=bodyAt(wk,'bi'),bi0=bodyAt(back,'bi');
  if(wa1&&wa0&&bi1&&bi0){
    var dwa=Math.round((wa1-wa0)*10)/10,dbi=Math.round((bi1-bi0)*10)/10;
    if(dwa>0.5&&dwa>dbi*1.5)
      t.push('За месяц талия '+(dwa>0?'+':'')+fmtW(dwa)+' см против бицепса '+(dbi>0?'+':'')+fmtW(dbi)+' см. Избыток великоват — сними 150–200 ккал, набор пошёл не туда.');
    else if(dbi>0.3&&dwa<=0.3)
      t.push('За месяц бицепс '+(dbi>0?'+':'')+fmtW(dbi)+' см при почти стоящей талии. Это ровно тот случай, когда менять ничего не надо.');
  }
  var bf1=bodyAt(wk,'bf'),bf0=bodyAt(back,'bf');
  if(bf1&&bf0&&bf1-bf0>1) t.push('Процент жира за месяц +'+fmtW(Math.round((bf1-bf0)*10)/10)+'. Для набора это много — урежь избыток примерно вдвое.');

  t.push('Белок '+N.prot+' г — это 1,8 г на кг, выше прироста не даёт. Жиры '+N.fat+' г — нижняя граница, ниже падают гормоны. Остальное углеводами: их проще всего добрать.');
  if(N.perDay>400) t.push('Тренировочный расход высокий: '+N.perDay+' ккал в день в среднем. В дни падела добирай сверху 300–400 ккал углеводами, иначе набор встанет на месте.');
  return t;
}

/* Верхняя граница диапазона повторов из строки плана: «8–12» → 12 */
function repTop(reps){var m=String(reps).match(/(\d+)\s*[–—-]\s*(\d+)/);return m?+m[2]:0;}
/* Двойная прогрессия: все рабочие подходы на верхней границе одним весом — пора добавлять */
function progHint(item,m,sArr,nSets){
  if(m.noW||m.unit==='сек')return '';
  var top=repTop(item.reps);if(!top)return '';
  var done=sArr.filter(function(s){return s&&s.d;});
  if(done.length<nSets)return '';
  var w0=done[0].w,ok=true;
  done.forEach(function(s){if(s.r<top||s.w!==w0)ok=false;});
  if(!ok)return '';
  return 'Все подходы на верхней границе: в следующий раз '+fmtW(w0)+' → '+fmtW(roundTo(w0+(m.step||2.5),m.step,m.min))+' кг';
}
/* Сколько недель лучший e1RM не двигается */
function plateau(exId){
  var m=EX[exId];if(!m||!m.e1)return 0;
  var by={};
  S.log.forEach(function(x){
    var e=x.e[exId];if(!e||!e.length)return;
    var wk=weekKey(x.s),b=0;
    e.forEach(function(s){var q=e1rm(s.w,s.r,m);if(q>b)b=q;});
    if(b&&(!by[wk]||b>by[wk]))by[wk]=b;
  });
  var ks=Object.keys(by).map(Number).sort(function(a,b){return a-b;});
  if(ks.length<4)return 0;
  var best=0,since=ks[0];
  ks.forEach(function(k){if(by[k]>best+0.5){best=by[k];since=k;}});
  var wks=Math.round((ks[ks.length-1]-since)/6048e5);
  return wks>=3?wks:0;
}

/* Календарных дней с последней тренировки, по датам, а не по часам */
function daysSince(){
  if(!S.log.length)return null;
  var last=S.log[S.log.length-1];
  var a=new Date(last.s);a.setHours(0,0,0,0);
  var b=new Date();b.setHours(0,0,0,0);
  return Math.round((b-a)/864e5);
}
/* Разбор от Claude. Всё содержимое — данные из репозитория, поэтому
   выводится только через esc(): никакой разметки из файла в страницу.
   Новый разбор открыт сразу, прочитанный сворачивается и не мешает. */
var advOpen=false;
function advFresh(){var A=S.advice;return !!(A&&A.at&&S.advSeen!==A.at);}
function advMarkSeen(){if(S.advice&&S.advice.at&&S.advSeen!==S.advice.at){S.advSeen=S.advice.at;save();}}
function adviceHtml(){
  var A=S.advice;
  if(!A||(!A.note&&!(A.general&&A.general.length)))return '';
  var at=A.at||'';
  /* Каждый пункт разбора — отдельная карточка: смахивается по одному,
     а не весь блок целиком. Подпись у всех общая — дата разбора,
     поэтому новый разбор возвращает сразу все пункты. */
  var body='';
  if(A.note)body+=card('adv:note',at,'<div class="adv">'+esc(A.note)+'</div>');
  (A.general||[]).forEach(function(g,i){
    body+=card('adv:'+i,at,'<div class="adv">'+(g.t?'<b>'+esc(g.t)+'</b>':'')+esc(g.b||'')+'</div>');
  });
  /* все пункты смахнуты — шапка без содержимого не нужна */
  if(!body)return '';
  return '<button class="advbtn'+(advOpen?' on':'')+'" data-a="advtog">'+
    '<span class="advtag">РАЗБОР CLAUDE</span>'+
    '<span class="d">'+esc(at)+(advFresh()?' · <em>новый</em>':'')+'</span></button>'+
    '<div class="advbox'+(advOpen?' on':'')+'">'+body+'</div>';
}
/* Карточка, которую можно смахнуть. sig — отпечаток данных: пока он тот же,
   смахнутая карточка не возвращается; изменились данные — появится снова. */
var hidCount=0;
function card(id,sig,html,cls){
  if(S.dismissed[id]===String(sig)){hidCount++;return '';}
  return '<div class="'+(cls||'tipwrap')+'" data-tip="'+id+'" data-sig="'+esc(String(sig))+'">'+html+'</div>';
}
function hintsHtml(){
  hidCount=0;
  var out=adviceHtml()+'<div class="tips">';
  var wk=weekKey(Date.now());
  var d=daysSince();

  var P=planFor(wk);
  if(S.bad[wk]) out+=card('bad',wk,'<div class="tip todo"><b>Неделя объявлена трудной.</b> План урезан до минимума, который удерживает результат: зал 1, мобильность 2, кор 1, локоть 5. Снять — на вкладке «Итоги».</div>');

  /* 1. Статус недели */
  var gd=planDone('gym',wk),gn=P.gym;
  if(gd>=gn&&gn>0){
    out+=card('gym',wk+':'+gd+'/'+gn,'<div class="tip good"><b>Зал на неделе закрыт: '+gd+' из '+gn+'.</b> Дальше решают еда и сон, а не дополнительные подходы.</div>');
  }else{
    var need=gn-gd;
    var nextDay=(!S.log.filter(function(x){return weekKey(x.s)===wk&&x.day==='A';}).length)?'A':'B';
    out+=card('gym',wk+':'+gd+'/'+gn,'<div class="tip todo"><b>Зал: '+gd+' из '+gn+'.</b> Осталось '+need+' — начни с дня '+nextDay+'. Между залами нужно минимум два дня.</div>');
  }

  /* 2. Домашние блоки */
  var miss=[];
  [['mob','мобильность'],['core','кор'],['wheel','ролик'],['prio','приоритет'],['elbow','локоть']].forEach(function(p){
    var done=planDone(p[0],wk),need2=P[p[0]];
    if(need2>0&&done<need2)miss.push(p[1]+' '+done+'/'+need2);
  });
  if(miss.length) out+=card('home',wk+':'+miss.join(','),'<div class="tip"><b>Дома осталось:</b> '+miss.join(', ')+'. Мобильность и кор важнее приоритета — они работают на спину.</div>');
  else if(S.log.filter(function(x){return weekKey(x.s)===wk;}).length) out+=card('home',wk+':all','<div class="tip good"><b>Домашние блоки на неделе выполнены полностью.</b></div>');

  /* 2б. Застой */
  var stuck=[];
  Object.keys(EX).forEach(function(k){var n=plateau(k);if(n)stuck.push({n:EX[k].name,w:n});});
  stuck.sort(function(a,b){return b.w-a.w;});
  if(stuck.length){
    var top3=stuck.slice(0,3);
    out+=card('stuck',top3.map(function(x){return x.n+x.w;}).join('|'),
      '<div class="tip todo"><b>Встало: '+top3.map(function(x){return x.n.toLowerCase()+' ('+x.w+' нед)';}).join(', ')+'.</b> '+
      'Три недели без роста — причина обычно не в тренировке. Проверь сон, добор калорий и не пора ли сменить упражнение.</div>');
  }

  /* 3. Пауза */
  if(d===null) out+=card('pause','first','<div class="tip">Первая тренировка. Веса подставлены расчётные — первым подходом откалибруй под себя.</div>');
  else if(d>=5) out+=card('pause','off'+d,'<div class="tip todo"><b>Без зала '+d+' дн.</b> Возвращайся с весами на 5–10% ниже последних, за две тренировки догонишь. Начинать заново не нужно.</div>');
  else if(d===0) out+=card('pause','today'+iso(Date.now()),'<div class="tip">Сегодня тренировка уже была. Если это второй заход — лучше ограничься мобильностью.</div>');

  /* 4. Замеры */
  var lastB=S.body.slice().sort(function(a,b){return a.d<b.d?-1:1;}).slice(-1)[0];
  var dow=(new Date().getDay()+6)%7;
  if(dow===6&&(!lastB||weekKey(new Date(lastB.d).getTime())!==wk))
    out+=card('meas',wk,'<div class="tip todo"><b>Воскресенье — день замеров.</b> Вкладка «Тело»: вес, обхваты, калипер, средние шаги и съеденные калории. От них считается норма.</div>');

  /* 4б. Резервная копия */
  if(S.log.length>=5){
    var since=S.backupAt?Math.round((Date.now()-S.backupAt)/864e5):null;
    if(!S.sync.tok&&(since===null||since>=30))
      out+=card('backup',since===null?'never':Math.floor(since/30),'<div class="tip todo"><b>'+(since===null?'Копия данных ещё ни разу не делалась.':'Последняя копия '+since+' дн. назад.')+'</b> Данные живут только в этом браузере. Настрой синхронизацию с GitHub во вкладке «Итоги» — дальше всё пойдёт само.</div>');
  }

  /* 5. Совет дня — меняется раз в сутки, смахнутый вернётся завтра */
  var fday=Math.floor(Date.now()/864e5);
  out+=card('fact',fday,'<div class="tip fact"><b>Совет дня</b>'+FACTS[fday%FACTS.length]+'</div>');
  out+='</div>';
  /* hidCount посчитан всеми вызовами card() выше — это ровно то,
     что скрыто прямо сейчас, а не всё когда-либо смахнутое */
  if(hidCount) out+='<div class="btns" style="margin:-6px 0 16px"><button class="sm" data-a="undis">Вернуть скрытые · '+hidCount+'</button></div>';
  return out;
}

/* ============ ЗВУК ============ */
var actx=null,amaster=null;
/* Мягкое насыщение (tanh) вместо жёсткого клиппинга: даёт максимум громкости
   без хрипа и заметно лучше «пробивает» динамик телефона. */
function audioOut(){
  if(!amaster){
    var t=actx.currentTime,N=1024,curve=new Float32Array(N),k=2.2,th=Math.tanh(k);
    for(var i=0;i<N;i++){curve[i]=Math.tanh((i*2/N-1)*k)/th;}
    var ws=actx.createWaveShaper();ws.curve=curve;ws.oversample='4x';
    var trim=actx.createGain();trim.gain.setValueAtTime(0.95,t);
    amaster=actx.createGain();amaster.gain.setValueAtTime(1,t);
    amaster.connect(ws);ws.connect(trim);trim.connect(actx.destination);
  }
  return amaster;
}
/* Сигналы ставятся в очередь звукового движка на точное время. Очередь
   исполняется в аудиопотоке и не зависит от таймеров вкладки — поэтому
   сигнал срабатывает и тогда, когда экран телефона уже погас. */
function tonesAt(t0,n){
  var dst=audioOut(),made=[];
  n=n||3;
  for(var i=0;i<n;i++){
    var t=t0+i*0.28,f=(i===n-1)?1568:1046;
    var g=actx.createGain();g.connect(dst);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.9,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.26);
    /* треугольник + октава сверху: заметно слышнее синуса на динамике телефона */
    var o=actx.createOscillator();o.type='triangle';o.frequency.setValueAtTime(f,t);o.connect(g);
    var o2=actx.createOscillator(),g2=actx.createGain();
    o2.type='sine';o2.frequency.setValueAtTime(f*2,t);g2.gain.setValueAtTime(0.35,t);
    o2.connect(g2);g2.connect(g);
    o.start(t);o.stop(t+0.28);o2.start(t);o2.stop(t+0.28);
    made.push(o,o2);
  }
  return made;
}
function buzz(){try{if(navigator.vibrate)navigator.vibrate([200,90,200,90,240]);}catch(e){}}
function beep(times){
  try{if(primeAudio())tonesAt(actx.currentTime,times||3);}catch(e){}
  buzz();
}
function primeAudio(){
  try{
    var C=window.AudioContext||window.webkitAudioContext;if(!C)return false;
    if(!actx)actx=new C();
    if(actx.state==='suspended')actx.resume();
    return true;
  }catch(e){return false;}
}
/* Неслышимый тон держит аудиопоток открытым на время отдыха. Без него система
   глушит вкладку через несколько секунд после блокировки экрана, и вместе с
   вкладкой замолкает уже поставленный в очередь сигнал. */
var keepN=null,alarmN=[];
function keepAlive(on){
  try{
    if(on){
      if(keepN||!primeAudio())return;
      var t=actx.currentTime;
      var o=actx.createOscillator(),g=actx.createGain();
      g.gain.setValueAtTime(0.0001,t);
      o.type='sine';o.frequency.setValueAtTime(40,t);
      o.connect(g);g.connect(actx.destination);o.start(t);
      keepN=o;
    }else if(keepN){
      try{keepN.stop();}catch(e){}
      keepN=null;
    }
  }catch(e){}
}
function scheduleAlarm(sec){
  cancelAlarm();
  if(!primeAudio())return;
  keepAlive(true);
  try{alarmN=tonesAt(actx.currentTime+sec,3);}catch(e){}
}
function cancelAlarm(){
  alarmN.forEach(function(n){try{n.stop(0);}catch(e){}});
  alarmN=[];
}
/* Уведомление — подстраховка на случай, если система всё же усыпила звук */
function askNotify(){
  try{if('Notification' in window&&Notification.permission==='default')Notification.requestPermission();}catch(e){}
}
function notifyRest(){
  try{
    if(!('Notification' in window)||Notification.permission!=='granted')return;
    if(navigator.serviceWorker&&navigator.serviceWorker.ready){
      navigator.serviceWorker.ready.then(function(r){
        r.showNotification('Отдых окончен',{body:'Следующий подход',tag:'rest',renotify:true,
          vibrate:[200,90,200,90,240],icon:'icon-192.png',badge:'icon-192.png'});
      }).catch(function(){});
    }
  }catch(e){}
}
document.addEventListener('touchstart',primeAudio,{once:true});
document.addEventListener('click',primeAudio,{once:true});

/* ============ СМАХИВАНИЕ КАРТОЧЕК ============
   Направление не важно — уводим в ту сторону, куда потянули. Порог 80 px,
   чтобы случайное движение при прокрутке ничего не убирало. */
var swipeSt=null,swipeAt=0;
document.addEventListener('pointerdown',function(e){
  var el=e.target.closest('[data-tip]');
  if(!el)return;
  swipeSt={el:el,x:e.clientX,y:e.clientY,dx:0,lock:null};
});
document.addEventListener('pointermove',function(e){
  if(!swipeSt)return;
  var dx=e.clientX-swipeSt.x,dy=e.clientY-swipeSt.y;
  if(swipeSt.lock===null){
    if(Math.abs(dx)<6&&Math.abs(dy)<6)return;
    /* решаем один раз: горизонталь — наша, вертикаль — прокрутке */
    swipeSt.lock=Math.abs(dx)>Math.abs(dy)?'x':'y';
  }
  if(swipeSt.lock!=='x')return;
  swipeSt.dx=dx;
  swipeSt.el.style.transform='translateX('+dx+'px)';
  swipeSt.el.style.opacity=String(Math.max(0.15,1-Math.abs(dx)/220));
});
function swipeEnd(){
  if(!swipeSt)return;
  var el=swipeSt.el,dx=swipeSt.dx,lock=swipeSt.lock;
  swipeSt=null;
  if(lock!=='x'){el.style.transform='';el.style.opacity='';return;}
  el.style.transition='transform .18s ease-out,opacity .18s ease-out';
  if(Math.abs(dx)>80){
    swipeAt=Date.now();
    el.style.transform='translateX('+(dx>0?window.innerWidth:-window.innerWidth)+'px)';
    el.style.opacity='0';
    var id=el.dataset.tip,sig=el.dataset.sig||'';
    setTimeout(function(){
      S.dismissed[id]=sig;save();renderWork();
      toast('Скрыто. Вернётся, когда обновятся данные');
    },170);
  }else{
    el.style.transform='';el.style.opacity='';
    setTimeout(function(){el.style.transition='';},200);
  }
}
document.addEventListener('pointerup',swipeEnd);
document.addEventListener('pointercancel',swipeEnd);

/* ============ НЕТ СЕТИ ============
   navigator.onLine доверять нельзя: он говорит только о том, что есть сетевой
   интерфейс. Wi-Fi без интернета, мобильный без оплаты, самолётный режим на
   одном из интерфейсов — во всех этих случаях он остаётся true. Поэтому сеть
   проверяем реальным запросом, а события online/offline берём как подсказку. */
var netOk=true,netTimer=null,netBusy=false;
function offline(){return !netOk;}
function paintNetBar(){
  var b=document.getElementById('offbar');
  if(!b)return;
  b.innerHTML='<b>Нет сети.</b> Тренировка пишется на телефон, в облако уедет сама, когда связь вернётся.';
  b.hidden=netOk;
}
function setNet(ok,announce){
  var was=netOk;
  netOk=!!ok;
  paintNetBar();
  if(was===netOk||!announce)return;
  if(netOk){
    cloudToast(true,'Сеть вернулась');
    /* догоняем то, что не уехало, пока связи не было */
    if(cloudReady()&&S.sync.err)setTimeout(function(){cloudPush(true);},600);
  }else{
    cloudToast(false,'Нет сети — тренировка пишется на телефон');
  }
}
function probeNet(announce){
  if(netBusy)return Promise.resolve(netOk);
  /* если интерфейса нет вовсе — это надёжный признак, запрос не нужен */
  if(typeof navigator.onLine==='boolean'&&!navigator.onLine){setNet(false,announce);return Promise.resolve(false);}
  netBusy=true;
  /* net=1 — метка для service worker: такие запросы он пропускает мимо кэша,
     иначе проверка всегда отвечала бы «есть сеть» из кэша */
  return fetch('manifest.json?net=1&t='+Date.now(),{cache:'no-store'})
    .then(function(r){netBusy=false;setNet(!!r&&r.ok,announce);return netOk;})
    .catch(function(){netBusy=false;setNet(false,announce);return false;});
}
window.addEventListener('offline',function(){setNet(false,true);});
window.addEventListener('online',function(){probeNet(true);});
/* Раз в 20 секунд, пока вкладка на экране: обрыв должен замечаться сам,
   без ожидания следующей выгрузки в облако. */
function netWatch(){
  clearInterval(netTimer);
  netTimer=setInterval(function(){
    if(document.hidden)return;
    probeNet(true);
  },20000);
}

/* ============ ЭКРАН НЕ ГАСНЕТ ============ */
var wlock=null;
function wakeOn(){
  try{
    if(!navigator.wakeLock||wlock)return;
    navigator.wakeLock.request('screen').then(function(l){
      wlock=l;l.addEventListener('release',function(){wlock=null;});
    }).catch(function(){});
  }catch(e){}
}
function wakeOff(){try{if(wlock){wlock.release();wlock=null;}}catch(e){}}

/* ============ ТАЙМЕР ОТДЫХА ============ */
var restT=null;
/* Следующий пункт плана после текущего — по нему считаем отдых перед ним */
function nextPlanItem(item){
  var ex=DAYS[S.active.day].ex;
  for(var i=0;i<ex.length;i++)if(ex[i].id===item.id)return ex[i+1]||null;
  return null;
}
function planItemFor(exId){
  if(!S.active)return null;
  var ex=DAYS[S.active.day].ex;
  for(var i=0;i<ex.length;i++)if(exIdFor(ex[i])===exId)return ex[i];
  return null;
}
/* Сколько отдыхать после конкретного подхода. Три правила поверх базового
   отдыха упражнения:
   — после разминочного хватает половины: он не утомляет, а только поднимает
     температуру и репетирует траекторию;
   — после последнего рабочего отдыхаем уже под СЛЕДУЮЩЕЕ упражнение: именно
     оно определяет, сколько нужно восстановиться. После последнего
     упражнения дня таймер не нужен вовсе;
   — в зале из любого таймера снимаем 10 секунд: столько уходит на дорогу до
     телефона. В описаниях техники цифры остаются прежними. */
function restFor(exId,kind,idx){
  if(!S.active)return 0;
  var m=EX[exId];if(!m)return 0;
  var base=m.restS||0;
  if(kind==='w'){
    base=base?Math.max(30,Math.round(base/2/15)*15):45;
  }else{
    var item=planItemFor(exId);
    if(item&&idx>=setsOf(S.active.day,item)-1){
      var nx=nextPlanItem(item);
      base=nx?Math.max(base,EX[exIdFor(nx)].restS||0):0;
    }
  }
  if(!base)return 0;
  if(DAYS[S.active.day].type==='gym')base=Math.max(20,base-10);
  return base;
}
function restSecFor(){
  if(!S.active)return 0;
  if(S.active.lastRest)return S.active.lastRest;
  var id=S.active.lastEx;
  if(!id||!EX[id])return 90;
  return EX[id].restS||0;
}
function startRest(sec,then){
  stopRest();
  if(!sec){if(then)then();else toast('Здесь отдых не нужен');return;}
  if(S.active)S.active.lastRest=sec;
  var end=Date.now()+sec*1000;
  var b=document.getElementById('restbtn');
  askNotify();
  /* звук ставится в очередь сразу, а не в момент срабатывания таймера */
  scheduleAlarm(sec);
  function up(){
    var left=Math.ceil((end-Date.now())/1000);
    if(left<=0){
      clearInterval(restT);restT=null;
      b.className='restbtn fire';b.textContent='Пора';
      buzz();notifyRest();keepAlive(false);
      setTimeout(function(){if(!restT)paintRest();},4000);
      if(then)then();
      return;
    }
    b.className='restbtn run';
    b.textContent=Math.floor(left/60)+':'+pad(left%60);
  }
  up();restT=setInterval(up,250);
}
function stopRest(){if(restT){clearInterval(restT);restT=null;}cancelAlarm();keepAlive(false);}
function paintRest(){
  var b=document.getElementById('restbtn');
  if(!S.active){b.hidden=true;stopRest();return;}
  b.hidden=false;
  if(restT)return;
  var s=restSecFor();
  b.className='restbtn';
  b.textContent=s?'Отдых '+restLabel(s):'Отдых';
}
document.getElementById('restbtn').addEventListener('click',function(){
  if(restT){stopRest();paintRest();toast('Отдых сброшен');return;}
  startRest(restSecFor());
});

/* ============ ПОДХОДЫ НА ВРЕМЯ ============ */
var setT=null;
function stopSetTimer(silent){
  if(!setT)return;
  clearInterval(setT.iv);
  var el=document.querySelector('.row[data-k="'+setT.kind+'"][data-i="'+setT.idx+'"]');
  setT=null;
  if(!silent)renderWork();
}
/* Записать подход на время и запустить всё, что идёт следом */
function finishTimedSet(exId,kind,idx,sec){
  var bank=kind==='w'?S.active.w:S.active.e;
  var arr=bank[exId]=bank[exId]||[];
  var cur=arr[idx]||{};
  arr[idx]={w:cur.w||0,r:sec,d:true,warn:false,q:cur.q};
  S.active.lastEx=exId;
  save();beep(3);renderWork();
  var rest=restFor(exId,kind,idx);
  var item=planItemFor(exId);
  var more=item&&kind==='s'&&idx<setsOf(S.active.day,item)-1;
  /* авто-ход: сам отдыхает и сам запускает следующий подход, чтобы за всё
     упражнение не пришлось коснуться экрана ни разу. Когда отдых не
     предусмотрен, всё равно даём 5 секунд — сменить сторону и лечь. */
  if(S.auto&&more&&EX[exId].unit==='сек'){
    startRest(Math.max(rest,5),function(){autoNextSet(exId,kind,idx+1);});
    return;
  }
  if(rest)startRest(rest);else paintRest();
}
/* Следующий подход в авто-режиме. Карточка уже перерисована, поэтому строку
   ищем заново; не нашли (упражнение свернулось) — цепочка на этом кончилась. */
function autoNextSet(exId,kind,idx){
  if(!S.active||!S.auto)return;
  var row=document.querySelector('.ex[data-ex="'+exId+'"] .row[data-k="'+kind+'"][data-i="'+idx+'"]');
  if(!row)return;
  var btn=row.querySelector('.chk'),rIn=row.querySelector('[data-f="r"]');
  var m=EX[exId],sec=rIn?num(rIn.value):0;
  if(!sec)sec=m.repdef||30;
  row.scrollIntoView({block:'center'});
  startSetTimer(exId,kind,idx,sec,btn,row);
}
function startSetTimer(exId,kind,idx,sec,btn,row){
  stopSetTimer(true);
  /* новый подход начался — отдых больше не идёт, иначе его сигнал
     сработает посреди упражнения */
  stopRest();paintRest();
  primeAudio();
  var m=EX[exId];
  /* Упражнение на две стороны — один подход это сторона А, короткая пауза
     на смену и сразу сторона Б. Отдых начинается только после обеих. */
  var ph=m.twoSide?[{n:'A',s:sec},{n:'смена',s:5},{n:'Б',s:sec}]:[{n:'',s:sec}];
  var pi=0,end=Date.now()+ph[0].s*1000;
  row.classList.add('timing');
  btn.classList.add('timing');
  function up(){
    var left=Math.ceil((end-Date.now())/1000);
    if(left<=0){
      pi++;
      if(pi<ph.length){
        /* между сторонами короткий сигнал, чтобы не смотреть на экран */
        beep(1);
        end=Date.now()+ph[pi].s*1000;
        return;
      }
      clearInterval(setT.iv);setT=null;
      finishTimedSet(exId,kind,idx,sec);
      return;
    }
    btn.textContent=(ph[pi].n?ph[pi].n+' ':'')+(left>=60?(Math.floor(left/60)+':'+pad(left%60)):left);
  }
  setT={exId:exId,kind:kind,idx:idx,sec:sec,st:Date.now(),iv:setInterval(up,200)};
  up();
}

/* ============ ЭКРАН: ТРЕНИРОВКА ============ */
/* Как свёрнуто упражнение: 'fold' и 'open' — решение пользователя, пусто —
   автоматика (закрыто целиком и запас проставлен). */
var foldSt={};
/* Замена упражнения: в плане слот item.id, а пишем и читаем по exIdFor —
   поэтому история подменённого упражнения остаётся своей и не смешивается. */
function exIdFor(item){return (S.active&&S.active.swap&&S.active.swap[item.id])||item.id;}
/* Ожидаемая длительность: среднее по последним трём таким же тренировкам.
   Пока их меньше трёх — по тому, что есть; совсем без истории — плановая
   прикидка из DAYS. */
function estMins(k){
  var rows=S.log.filter(function(x){return x.day===k;}).slice(-3);
  if(!rows.length)return{m:DAYS[k].mins||0,n:0};
  var s=0;rows.forEach(function(x){s+=minsOf(x);});
  return{m:Math.round(s/rows.length),n:rows.length};
}
function minsLabel(k){
  var e=estMins(k);
  if(!e.m)return '';
  return '~'+e.m+' мин'+(e.n?'':' (план)');
}
function frac(done,need){
  var c=need===0?'':(done>=need?' ok':(done>0?' miss':' zero'));
  return '<span class="dn fr'+c+'">'+done+'/'+need+'</span>';
}
function renderWork(){
  var v=document.getElementById('v-work'),sub=document.getElementById('sub');

  if(!S.active){
    sub.textContent='Выбери тренировку';
    var wk=weekKey(Date.now()),P=planFor(wk);
    var h=hintsHtml();
    h+='<p class="hdr">Дома</p><div class="pick home">';
    HOME_KEYS.forEach(function(k){
      var last=S.log.filter(function(x){return x.day===k;}).slice(-1)[0];
      h+='<button data-start="'+k+'">'+frac(planDone(k,wk),P[k])+'<span class="dd"><b>'+DAYS[k].t+'</b>'+
         '<span>'+minsLabel(k)+' · '+DAYS[k].ex.length+' упражнений</span>'+
         '<em>'+(last?'Последний раз: '+dwd(last.s):'Ещё не выполнялся')+'</em></span></button>';
    });
    h+='</div><p class="hdr">Зал</p><div class="pick">';
    /* план «зал 2» — это день A и день B по разу, поэтому у каждого своя
       доля, а не общая на двоих */
    var perDay=Math.max(1,Math.ceil(P.gym/2));
    ['A','B'].forEach(function(k){
      var last=S.log.filter(function(x){return x.day===k;}).slice(-1)[0];
      var tot=DAYS[k].ex.reduce(function(a,x){return a+setsOf(k,x);},0);
      h+='<button data-start="'+k+'">'+frac(planDone(k,wk),perDay)+'<span class="dd"><b>'+DAYS[k].t+'</b>'+
         '<span>'+minsLabel(k)+' · '+DAYS[k].ex.length+' упр. · '+tot+' подх.</span>'+
         '<em>'+(last?'Последний раз: '+dwd(last.s):'Ещё не выполнялся')+'</em></span></button>';
    });
    h+='</div><p class="hdr">Корт</p><div class="pick home">';
    var lp=S.log.filter(function(x){return x.day==='padel';}).slice(-1)[0];
    /* у падела нет недельной нормы — показываем просто сколько было */
    var pd=planDone('padel',wk);
    h+='<button data-start="padel"><span class="dn fr'+(pd?' ok':'')+'">'+pd+'</span><span class="dd"><b>Падел</b>'+
       '<span>Записать игру: время и калории с пульсометра</span>'+
       '<em>'+(lp?'Последний раз: '+dwd(lp.s):'Ещё не записан')+'</em></span></button></div>';
    v.innerHTML=h;setClock(null);return;
  }

  var day=DAYS[S.active.day];
  sub.textContent=day.t+' · идёт';
  var out='';
  /* Одна галка на всю тренировку: авто-ход всё равно общий, а в каждой
     карточке он занимал место без пользы. Показываем только там, где есть
     подходы на время — иначе переключать нечего. */
  if(day.ex.some(function(x){return EX[exIdFor(x)].unit==='сек';}))
    out+='<button class="autotop'+(S.auto?' on':'')+'" data-a="auto">'+
         '<span class="ab">'+(S.auto?'✓':'○')+'</span>Авто-ход</button>';
  day.ex.forEach(function(item,i){
    var exId=exIdFor(item),m=EX[exId],nSets=setsOf(S.active.day,item);
    var sArr=S.active.e[exId]||[],wArr=S.active.w[exId]||[];
    var doneN=sArr.filter(function(s){return s&&s.d;}).length;
    var tag=' data-ex="'+exId+'" data-item="'+item.id+'"';

    /* Сворачиваем не в момент последнего подхода, а когда у него проставлен
       запас повторов: иначе карточку пришлось бы разворачивать обратно ради
       одного тапа. У подходов на время запаса нет — там сворачиваем сразу.
       Подсказка о прибавке веса выносится в свёрнутую строку, иначе она
       появлялась бы ровно в момент сворачивания и оставалась незамеченной. */
    var lastSet=sArr[nSets-1];
    var rirSet=(m.unit==='сек')||!!(lastSet&&lastSet.q!==undefined&&lastSet.q!==null);
    var autoFold=doneN>=nSets&&rirSet,fs=foldSt[exId];
    if(fs==='fold'||(fs!=='open'&&autoFold)){
      var sum=sArr.filter(function(s){return s&&s.d;}).map(function(s){
        return m.noW?String(s.r):fmtW(s.w)+'×'+s.r;}).join('  ');
      var fh=progHint(item,m,sArr,nSets);
      out+='<article class="ex done"'+tag+'>'+
        '<button class="exfold" data-a="fold"><span class="exn">'+(i+1)+'</span>'+
        '<span class="ext"><h3>'+m.name+'</h3><span class="fsum">'+sum+'</span>'+
        (fh?'<span class="fsum" style="color:var(--ok)">↑ '+fh.replace('Все подходы на верхней границе: в следующий раз ','след. раз ')+'</span>':'')+
        '</span><span class="foldi">▾</span></button></article>';
      return;
    }

    var prevS=lastDone(exId,'e');
    var base=(sArr[0]&&sArr[0].w)||(prevS&&prevS[0]?prevS[0].w:0)||(m.bw||m.noW?0:m.start);
    var cust=S.custom[exId]||{};

    /* лучший e1RM в текущей сессии */
    var cur1=0;sArr.forEach(function(s){if(s&&s.d){var q=e1rm(s.w,s.r,m);if(q>cur1)cur1=q;}});
    var rec=bestEver(exId);
    var isPR=cur1>0&&cur1>=rec-0.01&&rec>0;

    out+='<article class="ex'+(doneN>=nSets?' done':'')+'"'+tag+'>'+
      '<button class="exh" data-a="fold"><span class="exn">'+(i+1)+'</span><span class="ext">'+
      '<h3>'+m.name+(isPR?'<span class="pr">Рекорд</span>':'')+(exId!==item.id?'<span class="grp">замена</span>':'')+'</h3>'+
      '<span class="tgt">'+nSets+' × '+item.reps+'<span class="grp">'+m.grp+'</span></span>'+
      '</span><span class="foldi">▴</span></button><p class="hint">'+m.hint+'</p>';
    if(m.e1&&cur1>0) out+='<div class="e1">Средний 1ПМ за подходы: '+Math.round(cur1)+' кг'+(rec>0?'  ·  рекорд '+Math.round(rec)+' кг':'')+'</div>';
    var ad=S.advice&&S.advice.ex&&S.advice.ex[exId];
    if(ad){
      var bits=[];
      if(ad.w!==undefined&&ad.w!==null)bits.push('<span class="n">'+fmtW(ad.w)+' кг</span>');
      if(ad.s)bits.push('<span class="n">'+esc(String(ad.s))+'</span> подх.');
      if(ad.r)bits.push('<span class="n">'+esc(String(ad.r))+'</span> повт.');
      out+='<div class="advline"><span class="advtag">CLAUDE</span> '+
           (bits.length?bits.join(' · ')+'. ':'')+esc(ad.b||'')+'</div>';
    }
    var ph=progHint(item,m,sArr,nSets);
    if(ph) out+='<div class="phint">'+ph+'</div>';
    var pl=plateau(exId);
    if(pl&&!ph) out+='<div class="pwarn">Лучший результат стоит '+pl+' нед. Смотри не на подходы, а на сон и добор калорий.</div>';
    if(cust.note) out+='<div class="mynote">'+esc(cust.note)+'</div>';
    out+='<div class="sets">';

    if(m.wu&&m.wu.length){
      out+='<div class="sect">Разминка</div>';
      m.wu.forEach(function(w,j){
        var st=wArr[j]||{};
        var wv=(st.w!==undefined&&st.w!==null)?st.w:(m.bw?0:roundTo(base*w.p,m.step,m.min));
        var rv=(st.r!==undefined&&st.r!==null)?st.r:w.r;
        out+=setRow(m,'w',j,wv,rv,!!st.d,null,false,null);
      });
      out+='<div class="sect">Рабочие</div>';
    }
    for(var j=0;j<nSets;j++){
      var st2=sArr[j]||{};
      var pv2=prevS&&prevS[j]?prevS[j]:null;
      var wv2=(st2.w!==undefined&&st2.w!==null)?st2.w:(pv2?pv2.w:(m.bw||m.noW?0:m.start));
      var rv2=(st2.r!==undefined&&st2.r!==null)?st2.r:(pv2?pv2.r:(m.repdef||item.rd));
      out+=setRow(m,'s',j,wv2,rv2,!!st2.d,pv2,!!st2.warn,st2.q);
    }
    out+='<div class="setbtns"><button data-a="set+">+ подход</button><button data-a="set-">− подход</button>'+
         '<button data-a="swap">Заменить</button><button data-a="note">Примечание</button>'+
'</div>';
    out+='</div><button class="tech-btn" aria-expanded="false" data-a="tech">Техника · отдых '+(m.rest||'—')+'</button>'+
         '<div class="tech">'+techHtml(m,exId)+'</div></article>';
  });
  out+='<button class="big go gap" data-a="finish">Завершить тренировку</button>'+
       '<button class="big dan gap" data-a="drop">Отменить без сохранения</button>';
  v.innerHTML=out;
}

function setRow(m,kind,j,wv,rv,done,pv,warn,rir){
  var lock=done?' disabled':'';
  /* side — подход целиком на одну сторону, поэтому нумеруем не подходами,
     а сторонами: так видно, что вторая сторона ещё впереди */
  var lbl=kind==='w'?'Р'+(j+1):(m.side?(j%2?'Б':'A'):(j+1));
  var s='<div class="row'+(kind==='w'?' wu':'')+(done?' filled':'')+(warn?' warn':'')+'" data-k="'+kind+'" data-i="'+j+'">'+
    '<span class="si'+(m.side&&kind==='s'?' sd':'')+'">'+lbl+'</span>';
  if(m.noW){
    s+='<span class="fld" style="flex:0 0 0;width:0;overflow:hidden"></span>';
  }else{
    s+='<span class="fld"><button data-a="w-"'+lock+'>−</button><input type="text" inputmode="decimal" data-f="w" value="'+fmtW(wv)+'"'+lock+'><button data-a="w+"'+lock+'>+</button></span><span class="un">'+(m.bw?'+кг':'кг')+'</span>';
  }
  s+='<span class="fld"><button data-a="r-"'+lock+'>−</button><input type="text" inputmode="numeric" data-f="r" value="'+rv+'"'+lock+'><button data-a="r+"'+lock+'>+</button></span><span class="un">'+(m.unit||'пв')+'</span>'+
    '<button class="chk'+(done?' on':'')+'" data-a="ok">'+(done?'✓':'○')+'</button></div>';
  /* Запас повторов — только у выполненного рабочего подхода: раньше его
     всё равно не знаешь, а места в строке он не занимает. */
  if(done&&kind==='s'&&m.unit!=='сек'){
    s+='<div class="rirbar"><span>Запас:</span>';
    [0,1,2,3].forEach(function(q){
      s+='<button data-a="rir" data-q="'+q+'"'+(rir===q?' class="on"':'')+'>'+q+'</button>';
    });
    s+='<span>'+(rir===undefined||rir===null?'сколько ещё мог':(rir===0?'до отказа':'в запасе'))+'</span></div>';
  }
  var pq=(pv&&pv.q!==undefined&&pv.q!==null)?'  ·  запас '+pv.q:'';
  if(pv&&!m.noW) s+='<div class="prev">прошлый раз: '+fmtW(pv.w)+(m.bw?'':' кг')+' × '+pv.r+pq+'</div>';
  else if(pv) s+='<div class="prev">прошлый раз: '+pv.r+pq+'</div>';
  if(warn) s+='<div class="wmsg">Сильное отклонение от прошлой тренировки — проверь цифры</div>';
  return s;
}

function techHtml(m,id){
  var c=S.custom[id]||{};
  var h='';
  if(m.rest) h+='<div class="lb">Отдых между подходами</div><span class="rest">'+m.rest+'</span>';
  h+='<div class="lb">Как делать</div><ol>';
  m.how.forEach(function(x){h+='<li>'+x+'</li>';});
  h+='</ol>';
  if(m.watch&&m.watch.length){h+='<div class="lb">Следи за</div><ul>';m.watch.forEach(function(x){h+='<li>'+x+'</li>';});h+='</ul>';}
  if(m.stop)h+='<div class="stop"><div class="lb">Стоп</div><p>'+m.stop+'</p></div>';
  if(m.note)h+='<p class="nt">'+m.note+'</p>';
  h+='<div class="lb">Моя техника</div>'+
     '<textarea class="small" data-tech="'+id+'" placeholder="Свои заметки по технике — сохраняются автоматически">'+esc(c.tech||'')+'</textarea>';
  return h;
}

var accSaveAt=0;

/* Время идёт от начала тренировки. Вычитается только то, что ты сам поставил на паузу. */
function bumpElapsed(){
  if(!S.active)return 0;
  var now=Date.now();
  var p=S.active.pAcc||0;
  if(S.active.pSince)p+=now-S.active.pSince;
  var ms=(now-S.active.s)-p;
  return ms>0?ms:0;
}
function isPaused(){return !!(S.active&&S.active.pSince);}
function flushElapsed(){if(S.active){save();accSaveAt=Date.now();}}
function setClock(on){
  var c=document.getElementById('clock');
  clearInterval(tick);tick=null;
  if(!on||!S.active){c.textContent='--:--';c.className='clock off mono';return;}
  function up(){
    c.textContent=hhmm(bumpElapsed())+(isPaused()?' ❚❚':'');
    c.className='clock mono'+(isPaused()?' pause':'');
    if(Date.now()-accSaveAt>15000){save();accSaveAt=Date.now();}
  }
  up();tick=setInterval(up,1000);
}

/* ============ ПОДТВЕРЖДЕНИЕ ============ */
var armed=null;
function disarm(){if(armed&&armed.el){armed.el.classList.remove('armed');armed.el.textContent=armed.txt;clearTimeout(armed.t);}armed=null;}
function arm(el,label){disarm();armed={el:el,txt:el.textContent,t:setTimeout(disarm,4500)};el.classList.add('armed');el.textContent=label;}

/* ============ КЛИКИ ============ */
document.addEventListener('click',function(ev){
  /* клик сразу после смахивания игнорируем — карточка уже уехала */
  if(Date.now()-swipeAt<400)return;
  var ed=ev.target.closest('[data-edit]');
  if(ed&&!ev.target.closest('button')){openEdit(+ed.dataset.edit);return;}
  var b=ev.target.closest('button');
  if(!b){disarm();return;}
  if(armed&&armed.el!==b)disarm();
  if(b.dataset.start){startDay(b.dataset.start);return;}
  if(b.dataset.v){switchView(b.dataset.v);return;}
  var a=b.dataset.a;if(!a)return;

  if(a==='tech'){var op=b.getAttribute('aria-expanded')==='true';b.setAttribute('aria-expanded',op?'false':'true');b.nextElementSibling.classList.toggle('open',!op);return;}
  if(a==='finish'){var n=countActive();if(!n){toast('Нет ни одного отмеченного подхода');return;}openFinish();return;}
  if(a==='drop'){
    if(armed&&armed.el===b){disarm();stopRest();stopSetTimer(true);S.active=null;foldSt={};wakeOff();save();renderWork();setClock(null);paintRest();toast('Тренировка отменена');}
    else arm(b,'Точно отменить? Всё сотрётся');return;}
  if(a==='fsave'){doFinish();return;}
  if(a==='psave'){savePadel();return;}
  if(a==='mclose'){closeModal();return;}
  if(a==='esave'){saveEdit();return;}
  if(a==='edel'){
    if(armed&&armed.el===b){
      var ei=+document.getElementById('eidx').value;disarm();
      var rm=S.log.splice(ei,1)[0];save();closeModal();
      if(document.getElementById('v-stat').classList.contains('on'))renderStat();else renderProg();
      toast('Удалено: '+(DAYS[rm.day]?DAYS[rm.day].t:rm.day)+' от '+dstr(rm.s));
    }else arm(b,'Точно удалить?');
    return;}
  if(a==='note'){openNote(b.closest('.ex').dataset.ex);return;}
  if(a==='nsave'){saveNote();return;}
  if(a==='undis'){S.dismissed={};save();renderWork();window.scrollTo(0,0);toast('Скрытые карточки возвращены');return;}
  if(a==='auto'){S.auto=!S.auto;save();renderWork();
    toast(S.auto?'Авто-ход включён: подходы на время и паузы между ними идут сами'
                :'Авто-ход выключен: каждый подход запускаешь сам');return;}
  if(a==='advtog'){advOpen=!advOpen;if(!advOpen)advMarkSeen();renderWork();return;}
  if(a==='fold'){var fx=b.closest('.ex').dataset.ex;
    foldSt[fx]=b.classList.contains('exfold')?'open':'fold';renderWork();return;}
  if(a==='swap'){openSwap(b.closest('.ex').dataset.item);return;}
  if(a==='doswap'){doSwap();return;}
  if(a==='set+'||a==='set-'){
    var host=b.closest('.ex'),itemId=host.dataset.item;
    var it=DAYS[S.active.day].ex.filter(function(x){return x.id===itemId;})[0];
    var cur=setsOf(S.active.day,it);
    var nv=a==='set+'?cur+1:cur-1;
    if(nv<1){toast('Минимум один подход');return;}
    if(nv>12){toast('Больше 12 подходов не нужно');return;}
    S.setsOv[itemId]=nv;save();renderWork();return;}
  if(a==='bm'){var bi=document.getElementById('b_'+b.dataset.k);bi.value=fmtW(Math.max(0,num(bi.value)+parseFloat(b.dataset.s)));return;}
  if(a==='bsave'){saveBody();return;}
  if(a==='bdel'){if(armed&&armed.el===b){var dd=b.dataset.d;disarm();S.body=S.body.filter(function(x){return x.d!==dd;});save();renderBody();toast('Запись удалена');}else arm(b,'Удалить?');return;}
  if(a==='dellast'){
    if(armed&&armed.el===b){disarm();var l=S.log.pop();save();renderStat();toast('Удалено: '+DAYS[l.day].t+' от '+dstr(l.s));}
    else arm(b,'Удалить последнюю?');return;}
  if(a==='cal'){calM=+b.dataset.m;renderStat();return;}
  if(a==='wsel'){var sw=+b.dataset.w;statWk=(statWk===sw)?null:sw;renderStat();return;}
  if(a==='okwk'){var ow=+b.dataset.w;if(S.weekOk[ow])delete S.weekOk[ow];else S.weekOk[ow]=1;
    save();cloudPush(true);renderStat();toast(S.weekOk[ow]?'Неделя зачтена как выполненная':'Зачёт снят');return;}
  if(a==='bad'){var bw=+b.dataset.w;if(S.bad[bw])delete S.bad[bw];else S.bad[bw]=1;save();renderStat();
    toast(S.bad[bw]?'Неделя отмечена трудной — план урезан':'Обычный план возвращён');return;}
  if(a==='sec'){var sk=b.dataset.s;openSec[sk]=!openSec[sk];renderStat();return;}
  if(a==='advget'){toast('Смотрю разбор…');cloudAdvice(false);return;}
  if(a==='sysave'){saveSync();return;}
  if(a==='syup'){toast('Выгружаю…');cloudPush(false);return;}
  if(a==='sydown'){
    if(armed&&armed.el===b){disarm();cloudPull();}
    else arm(b,'Заменить местные данные?');
    return;}
  if(a==='exp'){doExport();return;}
  if(a==='expcsv'){doCsv();return;}
  if(a==='expai'){doAi();return;}
  if(a==='imp'){doImport();return;}

  if(a==='rir'){
    /* .rirbar — соседний блок под строкой подхода, а не внутри неё */
    var rrow=b.parentNode.previousElementSibling;if(!rrow)return;
    var rex=b.closest('.ex').dataset.ex,ri=+rrow.dataset.i;
    var rarr=(rrow.dataset.k==='w'?S.active.w:S.active.e)[rex]||[];
    if(rarr[ri]){
      var q=+b.dataset.q;
      rarr[ri].q=(rarr[ri].q===q)?undefined:q;
      save();renderWork();
    }
    return;}

  var row=b.closest('.row');if(!row)return;
  var exId2=b.closest('.ex').dataset.ex,idx=+row.dataset.i,kind=row.dataset.k,m=EX[exId2];
  var wIn=row.querySelector('[data-f="w"]'),rIn=row.querySelector('[data-f="r"]');

  if(a==='w-'||a==='w+'){var st=m.step||2.5;wIn.value=fmtW(Math.max(0,num(wIn.value)+(a==='w+'?st:-st)));commit(exId2,kind,idx,row);return;}
  if(a==='r-'||a==='r+'){var rs=m.repstep||1;rIn.value=Math.max(0,num(rIn.value)+(a==='r+'?rs:-rs));commit(exId2,kind,idx,row);return;}
  if(a==='ok'){
    var bank=kind==='w'?S.active.w:S.active.e;
    var arr=bank[exId2]=bank[exId2]||[];
    var cur=arr[idx]||{},nd=!cur.d;
    var wv=wIn?num(wIn.value):0,rv=num(rIn.value);

    /* Упражнение на время: первый тап запускает отсчёт, второй засчитывает
       подход по фактически отсчитанному времени. Ошибся — тапни ещё раз по
       галочке, отметка снимется. */
    if(m.unit==='сек'&&nd){
      if(setT&&setT.exId===exId2&&setT.kind===kind&&setT.idx===idx){
        /* засчитываем запланированное время, а не отсчитанное: тапают
           именно чтобы закрыть подход, а не чтобы урезать его до секунд */
        var done=setT.sec;
        stopSetTimer(true);
        finishTimedSet(exId2,kind,idx,done);
        toast('Засчитано: '+done+' сек');
        return;
      }
      startSetTimer(exId2,kind,idx,rv||m.repdef||30,b,row);
      return;
    }
    if(setT&&setT.exId===exId2&&setT.kind===kind&&setT.idx===idx)stopSetTimer(true);

    var warn=false;
    if(nd&&kind==='s'){
      var pv=lastDone(exId2,'e'),p=pv&&pv[idx]?pv[idx]:null;
      if(p){
        if(!m.noW&&p.w>0&&Math.abs(wv-p.w)/p.w>0.35)warn=true;
        if(p.r>0&&Math.abs(rv-p.r)/p.r>0.6)warn=true;
      }
      if(wv>400||rv>120)warn=true;
    }
    arr[idx]={w:wv,r:rv,d:nd,warn:warn,q:cur.q};
    if(nd)S.active.lastEx=exId2;

    /* Рекорд проверяем только когда упражнение закрыто целиком: среднее по
       подходам до последнего из них ещё ничего не значит. */
    if(nd&&kind==='s'&&m.e1){
      var itm=planItemFor(exId2);
      var need=itm?setsOf(S.active.day,itm):0;
      var doneNow=arr.filter(function(x){return x&&x.d;}).length;
      if(need&&doneNow>=need){
        var before=bestEver(exId2),now=exScore(arr,m);
        if(now>0&&before>0&&now>before+0.5)
          setTimeout(function(){toast('Рекорд! Средний 1ПМ за подходы: '+Math.round(now)+' кг',1);},80);
      }
    }
    save();renderWork();
    /* отдых стартует сам — второй тап не нужен, кнопка остаётся для ручного случая */
    if(nd){var rs=restFor(exId2,kind,idx);if(rs){startRest(rs);return;}}
    paintRest();return;
  }
});

function doFinish(){
  var a=S.active,ce={},cw={};
  Object.keys(a.e).forEach(function(k){var q=a.e[k].filter(function(s){return s&&s.d;});if(q.length)ce[k]=q;});
  Object.keys(a.w).forEach(function(k){var q=a.w[k].filter(function(s){return s&&s.d;});if(q.length)cw[k]=q;});
  var mins=Math.max(1,num(document.getElementById('fmins').value));
  var kcal=num(document.getElementById('fkcal').value);
  var note=document.getElementById('fnote').value.trim();
  S.log.push({day:a.day,type:a.type||DAYS[a.day].type,s:a.s,f:a.s+mins*60000,e:ce,w:cw,
              kcal:kcal||0,note:note,bw:bodyW(),
              swap:(a.swap&&Object.keys(a.swap).length)?a.swap:undefined});

  freezePlan(weekKey(a.s));

  save();closeModal();renderWork();setClock(null);paintRest();
  var l=S.log[S.log.length-1];

function openSwap(itemId){
  var cur=exIdFor({id:itemId}),m=EX[cur];
  var same=[],other=[];
  Object.keys(EX).forEach(function(k){
    if(k===cur||EX[k].legacy)return;
    /* упражнение без веса вместо силового — почти всегда ошибка, не предлагаем */
    if(EX[k].noW&&!m.noW)return;
    (EX[k].grp===m.grp?same:other).push(k);
  });
  var opt=function(k){return '<option value="'+k+'">'+EX[k].name+'</option>';};
  openModal('<h3>Замена упражнения</h3><p class="sub">Сейчас: '+m.name+'. Тренажёр занят — подставь аналог. История подменённого упражнения останется отдельной, ничего не перемешается.</p>'+
    '<select id="swsel"><option value="'+itemId+'">— вернуть по плану: '+EX[itemId].name+' —</option>'+
    (same.length?'<optgroup label="Та же группа: '+m.grp+'">'+same.map(opt).join('')+'</optgroup>':'')+
    '<optgroup label="Остальные">'+other.map(opt).join('')+'</optgroup></select>'+
    '<input type="hidden" id="swid" value="'+itemId+'">'+
    '<button class="big go" data-a="doswap">Заменить</button>'+
    '<button class="big fin gap" data-a="mclose">Назад</button>');
}
function doSwap(){
  var itemId=document.getElementById('swid').value,nv=document.getElementById('swsel').value;

/* ============ РАСЧЁТЫ ============ */
function countSets(x){var n=0;Object.keys(x.e).forEach(function(k){n+=x.e[k].length;});return n;}
function tonnage(x){
  var t=0;
  Object.keys(x.e).forEach(function(k){
    var m=EX[k];if(!m||m.unit==='сек'||m.noW)return;
    var mu=m.hand?2:1;
    x.e[k].forEach(function(s){t+=(m.bw?bodyW()+s.w:s.w)*s.r*mu;});
  });
  return t;
}
function groupWeek(wk){
  var g={};GROUPS.forEach(function(x){g[x]=0;});
  S.log.forEach(function(x){
    if(weekKey(x.s)!==wk)return;
    Object.keys(x.e).forEach(function(k){var m=EX[k];if(m&&g[m.grp]!==undefined)g[m.grp]+=x.e[k].length;});
  });
  return g;
}
/* Индекс силы: среднее по упражнениям отношение текущего лучшего e1RM к первому. 100 = старт */
function strengthIndex(){
  var base={},pts=[],best={};
  S.log.forEach(function(sess){
    Object.keys(sess.e).forEach(function(k){
      var m=EX[k];if(!m||!IDX_EX[k])return;
      var b=0;sess.e[k].forEach(function(s){var q=setScore(s.w,s.r,m);if(q>b)b=q;});
      if(!b)return;
      if(!base[k])base[k]=b;
      if(!best[k]||b>best[k])best[k]=b;
    });
    var ks=Object.keys(best);
    if(!ks.length)return;
    var sum=0;ks.forEach(function(k){sum+=best[k]/base[k];});
    pts.push({x:dstr(sess.s),y:Math.round(sum/ks.length*1000)/10});
  });
  return pts;
}
function weekStatus(wk){
  /* ручной зачёт перекрывает расчёт: бывает, что неделя закрыта по факту,
     а план тогда выглядел иначе, чем сейчас */
  if(S.weekOk[wk])return 'g';
  var ss=S.log.filter(function(x){return weekKey(x.s)===wk;});
  if(!ss.length&&wk>=weekKey(Date.now()))return 'n';
  var P=planFor(wk);
  var gym=ss.filter(function(x){return typeOf(x)==='gym';}).length;
  var home=ss.filter(function(x){return typeOf(x)==='home';}).length;
  if(gym<P.gym)return 'r';
  if(home<homeNeed(P))return 'y';
  return 'g';
}
/* Подходы по группам за последние n недель */
function groupTrend(n){
  var wk=weekKey(Date.now()),wks=[],by=[];
  for(var i=n-1;i>=0;i--){var w=wk-i*7*864e5;wks.push(w);by.push(groupWeek(w));}
  return{wks:wks,by:by};
}
function streak(){
  var wk=weekKey(Date.now())-7*864e5,n=0;
  while(true){
    var st=weekStatus(wk);
    if(st==='g'){n++;wk-=7*864e5;}else break;
    if(n>200)break;
  }
  return n;
}

/* ============ ГРАФИК ============ */
function lineChart(pts,color,unit){
  if(!pts.length)return '<p class="empty">Пока нет данных</p>';
  var W=560,H=180,pl=46,pr=12,pt=16,pb=26;
  var ys=pts.map(function(p){return p.y;});
  var mn=Math.min.apply(null,ys),mx=Math.max.apply(null,ys);
  if(mx===mn)mx=mn+(mn===0?1:Math.abs(mn)*.08);
  var lo=mn,pd=(mx-mn)*.15;mn-=pd;mx+=pd;if(mn<0&&lo>=0)mn=0;
  function X(i){return pts.length===1?pl+(W-pl-pr)/2:pl+i*(W-pl-pr)/(pts.length-1);}
  function Y(v){return pt+(1-(v-mn)/(mx-mn))*(H-pt-pb);}
  var g='';
  [0,.5,1].forEach(function(f){
    var v=mn+(mx-mn)*f,y=Y(v);
    g+='<line x1="'+pl+'" y1="'+y+'" x2="'+(W-pr)+'" y2="'+y+'" stroke="#2B3238" stroke-width="1"/>'+
       '<text x="'+(pl-6)+'" y="'+(y+4)+'" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="11" fill="#5C666D">'+(Math.round(v*10)/10)+'</text>';
  });
  var d=pts.map(function(p,i){return (i?'L':'M')+X(i).toFixed(1)+' '+Y(p.y).toFixed(1);}).join(' ');
  g+='<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  var ev=Math.ceil(pts.length/6);
  pts.forEach(function(p,i){
    g+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="3.5" fill="'+color+'"/>';
    if(i%ev===0||i===pts.length-1)g+='<text x="'+X(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="#5C666D">'+p.x+'</text>';
  });
  g+='<text x="'+(W-pr)+'" y="'+pt+'" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="600" fill="'+color+'">'+(Math.round(pts[pts.length-1].y*100)/100)+' '+unit+'</text>';
  return '<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">'+g+'</svg>';
}

var progSel='incline_db';
function renderProg(){
  var v=document.getElementById('v-prog'),ids=[];
  Object.keys(DAYS).forEach(function(k){DAYS[k].ex.forEach(function(x){if(ids.indexOf(x.id)<0)ids.push(x.id);});});
  var h='<select id="psel">';
  ids.forEach(function(id){h+='<option value="'+id+'"'+(id===progSel?' selected':'')+'>'+EX[id].name+'</option>';});
  h+='</select>';
  var m=EX[progSel],rows=[];
  S.log.forEach(function(x,li){var e=x.e[progSel];if(e&&e.length){var b=null;e.forEach(function(s){if(!b||(m.noW||m.bw?s.r>b.r:s.w>b.w||(s.w===b.w&&s.r>b.r)))b=s;});rows.push({ts:x.s,sets:e,best:b,li:li});}});
  if(!rows.length){h+='<p class="empty">По этому упражнению пока нет записей.</p>';v.innerHTML=h;bindSel();return;}
  if(m.e1){
    h+='<div class="chart"><h5>Расчётный 1ПМ, кг</h5>'+lineChart(rows.map(function(r){
      var b=0;r.sets.forEach(function(s){var q=e1rm(s.w,s.r,m);if(q>b)b=q;});return{x:dstr(r.ts),y:Math.round(b*10)/10};}),'#55BC8A','кг')+'</div>';
  }
  h+='<div class="chart"><h5>'+((m.bw||m.noW)?'Лучший подход, повторов':'Рабочий вес, кг')+'</h5>'+
     lineChart(rows.map(function(r){return{x:dstr(r.ts),y:(m.bw||m.noW)?r.best.r:r.best.w};}),'#E0A33E',(m.bw||m.noW)?'пв':'кг')+'</div>';
  if(!m.noW&&m.unit!=='сек'){
    h+='<div class="chart"><h5>Объём за тренировку, кг</h5>'+lineChart(rows.map(function(r){
      var mu=m.hand?2:1,t=0;r.sets.forEach(function(s){t+=(m.bw?bodyW()+s.w:s.w)*s.r*mu;});return{x:dstr(r.ts),y:Math.round(t)};}),'#68ACEC','кг')+'</div>';
  }
  h+='<h4>Последние тренировки</h4><p class="sub">Только рабочие подходы. Нажми на строку, чтобы поправить время, калории и заметку.</p><table><tr><th>Дата</th><th>Подходы</th></tr>';
  rows.slice(-14).reverse().forEach(function(r){
    var t=r.sets.map(function(s){return m.noW?s.r:((m.bw&&s.w>0?'+'+fmtW(s.w)+'×':m.bw?'':fmtW(s.w)+'×'))+s.r;}).join('   ');
    h+='<tr data-edit="'+r.li+'" style="cursor:pointer"><td class="n">'+dwd(r.ts)+'</td><td class="n" style="color:var(--tx)">'+t+'</td></tr>';
  });
  h+='</table>';
  v.innerHTML=h;bindSel();
}

function saveBody(){
  var d=document.getElementById('bdate').value;
  if(!d){toast('Укажи дату');return;}
  var rec={d:d},any=false;
  BODY.forEach(function(f){var raw=document.getElementById('b_'+f.k).value.trim();if(raw!==''){rec[f.k]=num(raw);any=true;}});
  if(!any){toast('Заполни хотя бы одно поле');return;}
  S.body=S.body.filter(function(x){return x.d!==d;});
  S.body.push(rec);save();cloudPush(true);renderBody();toast('Замер сохранён: '+d);window.scrollTo(0,0);
}

     '<div class="btns"><button class="sm" data-a="exp">Копия (JSON)</button><button class="sm" data-a="expcsv">Таблица (CSV)</button>'+
     '<button class="sm" data-a="expai">Отчёт для Claude</button><button class="sm" data-a="imp">Восстановить</button></div>'+
     '<textarea class="io" id="io" placeholder="Сюда попадёт выгрузка — выдели и скопируй. Чтобы восстановить, вставь сюда сохранённый JSON и нажми «Восстановить»."></textarea>';
  h+=sec('tech','Синхронизация и данные',S.sync.at?'настроена':'не настроена',tb2);

  v.innerHTML=h;
  bindPlan();
  var gs=document.getElementById('gsel');
  if(gs)gs.addEventListener('change',function(){S.gain=gs.value;save();renderStat();});
}
function planRow(k,n){
  var done=planDone(k),need=S.plan[k];
  var col=need===0?'var(--dim)':(done>=need?'var(--ok)':(done>0?'var(--warn)':'var(--stop)'));
  return '<tr><td>'+n+'</td>'+
    '<td style="width:64px;text-align:center"><b class="mono" style="color:'+col+';font-size:16px">'+done+'/'+need+'</b></td>'+
    '<td style="width:118px"><span class="fld"><button data-a="pl" data-k="'+k+'" data-s="-1">−</button>'+
    '<input type="text" inputmode="numeric" id="p_'+k+'" value="'+need+'" style="height:34px" readonly><button data-a="pl" data-k="'+k+'" data-s="1">+</button></span></td></tr>';
}
function bindPlan(){
  document.querySelectorAll('[data-a="pl"]').forEach(function(b){
    b.addEventListener('click',function(){
      var k=b.dataset.k,nv=Math.max(0,Math.min(14,S.plan[k]+ +b.dataset.s));
      S.plan[k]=nv;
      /* снимок текущей недели держим в актуальном состоянии: когда неделя
         закончится, закреплённым останется именно то, что было в конце */
      freezePlan(weekKey(Date.now()));
      save();renderStat();
    });
  });
}

/* ============ ОБЛАКО: GITHUB ============
   Токен хранится только в этом браузере и намеренно не входит в dump() —
   иначе он уехал бы в сам репозиторий вместе с данными. */
function b64(s){
  var by=new TextEncoder().encode(s),bin='';
  for(var i=0;i<by.length;i++)bin+=String.fromCharCode(by[i]);
  return btoa(bin);
}
function unb64(s){
  var bin=atob(String(s).replace(/\s/g,'')),a=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(a);
}
function ghUrl(){return 'https://api.github.com/repos/'+S.sync.repo.replace(/^\/+|\/+$/g,'')+'/contents/'+(S.sync.path||'data.json');}
function ghHead(json){
  var h={'Authorization':'Bearer '+S.sync.tok,'Accept':'application/vnd.github+json'};
  if(json)h['Content-Type']='application/json';
  return h;
}
function cloudReady(){return !!(S.sync.tok&&S.sync.repo);}
function syncErr(e,quiet,what){
  S.sync.err=String((e&&e.message)||e);save();
  if(!quiet){toast(what+': '+S.sync.err);renderStatIfOpen();}
  return false;
}
function renderStatIfOpen(){if(document.getElementById('v-stat').classList.contains('on'))renderStat();}

function cloudPush(quiet){
  if(!cloudReady())return Promise.resolve(false);
  var body=dump();
  /* сначала узнаём sha текущего файла: GitHub требует его для перезаписи */
  return fetch(ghUrl(),{headers:ghHead()})
    .then(function(r){return r.status===200?r.json():null;})
    .catch(function(){return null;})
    .then(function(cur){
      var pl={message:'Зал: '+iso(Date.now())+', тренировок '+S.log.length,content:b64(body)};
      if(cur&&cur.sha)pl.sha=cur.sha;
      return fetch(ghUrl(),{method:'PUT',headers:ghHead(true),body:JSON.stringify(pl)});
    })
    .then(function(r){
      if(!r.ok)return r.text().then(function(t){
        var m='HTTP '+r.status;
        try{m=JSON.parse(t).message||m;}catch(e){}
        throw new Error(m);
      });
      S.sync.at=Date.now();S.sync.err='';S.backupAt=Date.now();save();
      setNet(true,false);
      cloudToast(true,'Данные сохранены в облаке');
      if(!quiet)renderStatIfOpen();
      return true;
    })
    .catch(function(e){
      var m=netMsg(e);
      S.sync.err=m;save();
      /* неудачная выгрузка — самое надёжное свидетельство обрыва */
      if(m==='нет сети')setNet(false,false);
      cloudToast(false,'Не сохранилось в облако: '+m+'. На телефоне данные целы.');
      if(!quiet)renderStatIfOpen();
      return false;
    });
}

/* ---- Советы ----
   advice.json лежит рядом с data.json в том же приватном репозитории.
   Данные приложение туда пишет, советы — только читает. */
function advUrl(){
  var p=S.sync.path||'data.json',i=p.lastIndexOf('/');
  return 'https://api.github.com/repos/'+S.sync.repo.replace(/^\/+|\/+$/g,'')+
         '/contents/'+(i>=0?p.slice(0,i+1):'')+'advice.json';
}
function cloudAdvice(quiet){
  if(!cloudReady())return Promise.resolve(false);
  return fetch(advUrl(),{headers:ghHead()})
    .then(function(r){
      if(r.status===404)return null;   /* советов ещё не клали — это не ошибка */
      if(!r.ok)throw new Error('HTTP '+r.status);
      return r.json();
    })
    .then(function(j){
      if(!j){if(!quiet)toast('Разбора в репозитории пока нет');return false;}
      var d=JSON.parse(unb64(j.content));
      if(!d||typeof d!=='object'||Array.isArray(d))throw new Error('файл советов повреждён');
      var fresh=!S.advice||S.advice.at!==d.at;
      S.advice=d;save();
      advOpen=advFresh();
      renderWork();renderStatIfOpen();
      if(!quiet)toast(fresh?'Разбор обновлён: '+(d.at||''):'Разбор уже свежий');
      else if(fresh)cloudToast(true,'Пришёл свежий разбор от Claude');
      return true;
    })
    .catch(function(e){
      if(!quiet)toast('Разбор не загрузился: '+netMsg(e));
      return false;
    });
}
function cloudPull(){
  if(!cloudReady()){toast('Сначала впиши репозиторий и токен');return;}
  fetch(ghUrl(),{headers:ghHead()})
    .then(function(r){
      if(!r.ok)return r.text().then(function(t){
        var m='HTTP '+r.status;
        try{m=JSON.parse(t).message||m;}catch(e){}
        throw new Error(m);
      });
      return r.json();
    })
    .then(function(j){
      var d=JSON.parse(unb64(j.content));
      if(!d||!Array.isArray(d.log))throw new Error('файл не похож на копию данных');
      applyDump(d);
      S.sync.at=Date.now();S.sync.err='';save();
      renderWork();renderStatIfOpen();
      toast('Загружено: '+S.log.length+' тренировок, '+S.body.length+' замеров');
    })
    .catch(function(e){syncErr(e,false,'Не загрузилось');});
}
function saveSync(){
  S.sync.repo=document.getElementById('syrepo').value.trim().replace(/^https?:\/\/github\.com\//,'');
  S.sync.path=document.getElementById('sypath').value.trim()||'data.json';
  S.sync.tok=document.getElementById('sytok').value.trim();
  S.sync.err='';save();renderStat();
  toast(cloudReady()?'Настройки сохранены. Проверь кнопкой «Выгрузить сейчас»':'Заполни репозиторий и токен');
}

/* ============ ЭКСПОРТ ============ */
function fixPlan(){Object.keys(PLAN0).forEach(function(k){if(S.plan[k]===undefined)S.plan[k]=PLAN0[k];});}
function applyDump(d){
  S.log=d.log||[];S.body=d.body||[];S.custom=d.custom||{};S.setsOv=d.setsOv||{};
  if(d.plan)S.plan=d.plan;
  S.planHist=d.planHist||{};S.bad=d.bad||{};S.weekOk=d.weekOk||{};
  if(d.gain&&GAIN[d.gain])S.gain=d.gain;
  fixPlan();backfillPlans();
}
/* Советы сюда не входят: они живут в отдельном advice.json, который приложение
   только читает. Токен не входит тем более. */
function dump(){return JSON.stringify({v:3,log:S.log,body:S.body,custom:S.custom,setsOv:S.setsOv,
  plan:S.plan,planHist:S.planHist,bad:S.bad,weekOk:S.weekOk,gain:S.gain});}
function dl(name,text,mime){
  try{
    var b=new Blob([text],{type:mime||'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');
    a.href=u;a.download=name;document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(u);a.remove();},400);return true;
  }catch(e){return false;}
}
function doExport(){var t=dump();document.getElementById('io').value=t;dl('zal-'+iso(Date.now())+'.json',t);S.backupAt=Date.now();save();toast('Копия в поле ниже. Если файл не скачался — скопируй текст');}
function doCsv(){
  var rows=['Дата;День;Тип;Упражнение;Подход;Вес;Повторы;Запас;Ккал'];
  S.log.slice().sort(function(a,b){return a.s-b.s;}).forEach(function(x){
    var nm=DAYS[x.day]?DAYS[x.day].t:x.day,tp=typeOf(x);
    if(!Object.keys(x.e).length){
      rows.push([iso(x.s),nm,tp,'—','','','','',kcalOf(x)].join(';'));return;
    }
    Object.keys(x.e).forEach(function(k){
      x.e[k].forEach(function(s,i){
        rows.push([iso(x.s),nm,tp,(EX[k]?EX[k].name:k),i+1,String(s.w).replace('.',','),s.r,
                   (s.q===undefined||s.q===null?'':s.q),(i===0?kcalOf(x):'')].join(';'));
      });
    });
  });
  rows.push('');rows.push('Дата;'+BODY.map(function(f){return f.n+', '+f.u;}).join(';'));
  S.body.slice().sort(function(a,b){return a.d<b.d?-1:1;}).forEach(function(r){
    rows.push([r.d].concat(BODY.map(function(f){return r[f.k]!==undefined?String(r[f.k]).replace('.',','):'';})).join(';'));
  });
  var csv='\ufeff'+rows.join('\n');
  document.getElementById('io').value=csv;
  dl('zal-tablica-'+iso(Date.now())+'.csv',csv,'text/csv');
  toast('CSV в поле ниже. Открывается в Excel и Google Таблицах');
}
function doAi(){
  var L=[];
  L.push('ОТЧЁТ ПО ТРЕНИРОВКАМ, '+iso(Date.now()));
  L.push('Тренировок всего: '+S.log.length+'. План: зал '+S.plan.gym+'/нед, дома '+(S.plan.mob+S.plan.core+S.plan.wheel+S.plan.prio)+'/нед.');
  var si=strengthIndex();
  if(si.length)L.push('Индекс силы: '+si[0].y+' → '+si[si.length-1].y);
  L.push('');
  L.push('ПРОГРЕСС ПО УПРАЖНЕНИЯМ (дата: подходы вес×повт)');
  var ids=[];Object.keys(DAYS).forEach(function(k){DAYS[k].ex.forEach(function(x){if(ids.indexOf(x.id)<0)ids.push(x.id);});});
  ids.forEach(function(id){
    var m=EX[id],rr=[];
    S.log.forEach(function(x){
      var e=x.e[id];if(!e||!e.length)return;
      rr.push(dstr(x.s)+': '+e.map(function(s){
        return (m.noW?String(s.r):fmtW(s.w)+'×'+s.r)+(s.q!==undefined&&s.q!==null?'@'+s.q:'');
      }).join(' '));
    });
    if(rr.length)L.push('• '+m.name+' ['+m.grp+']\n   '+rr.slice(-8).join('\n   '));
  });
  L.push('');
  L.push('ЗАМЕРЫ ТЕЛА');
  S.body.slice().sort(function(a,b){return a.d<b.d?-1:1;}).slice(-10).forEach(function(r){
    L.push('  '+r.d+': '+BODY.filter(function(f){return r[f.k]!==undefined;}).map(function(f){return f.n+' '+fmtW(r[f.k])+f.u;}).join(', '));
  });
  L.push('');
  var stuck=[];
  Object.keys(EX).forEach(function(k){var n=plateau(k);if(n)stuck.push(EX[k].name+' — '+n+' нед');});
  if(stuck.length){L.push('ЗАСТОЙ (лучший e1RM не растёт)');stuck.forEach(function(s){L.push('  '+s);});L.push('');}

  L.push('НЕДЕЛИ (статус: g=по плану, y=пропущено дома, r=пропущен зал)');
  var seen={};
  S.log.slice().reverse().forEach(function(x){
    var wk=weekKey(x.s);if(seen[wk])return;seen[wk]=1;
    var ss=S.log.filter(function(y){return weekKey(y.s)===wk;});
    var g=ss.filter(function(y){return typeOf(y)==='gym';}).length;
    var hm=ss.filter(function(y){return typeOf(y)==='home';}).length;
    var pd=ss.filter(function(y){return typeOf(y)==='padel';}).length;
    L.push('  с '+dstr(wk)+': зал '+g+', дома '+hm+', падел '+pd+', ккал '+weekKcal(wk)+
           (S.bad[wk]?', ТРУДНАЯ НЕДЕЛЯ':'')+' — '+weekStatus(wk));
  });
  L.push('');
  var Nn=nutrition(weekKey(Date.now()));
  L.push('ПИТАНИЕ, расчёт на текущую неделю (режим набора: '+(GAIN[S.gain]||GAIN.hard).n+')');
  L.push('  вес '+fmtW(Nn.w)+' кг, шаги '+Nn.steps+'/день');
  L.push('  расход по формуле '+Nn.tdee+' ккал'+
         (Nn.tdeeReal!==null?', по факту '+Nn.tdeeReal+' ккал (ел '+Nn.eaten+', рос '+fmtW(Nn.rate)+' кг/нед)':', факта нет — не заполнено съеденное'));
  L.push('  цель '+Nn.target+' ккал: белок '+Nn.prot+' г, жиры '+Nn.fat+' г, углеводы '+Nn.carb+' г');
  L.push('  темп веса: '+(Nn.rate===null?'мало данных':(Nn.rate>=0?'+':'')+fmtW(Nn.rate)+' кг/нед'));
  var t=L.join('\n');
  document.getElementById('io').value=t;
  /* копируем сразу: выделять простыню руками на телефоне неудобно */
  var done=function(ok){
    dl('otchet-'+iso(Date.now())+'.txt',t,'text/plain');
    toast(ok?'Отчёт скопирован — вставь мне в чат':'Отчёт в поле ниже — выдели и скопируй');
  };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){done(true);},function(){done(false);});
  }else done(false);
}
function doImport(){
  var t=document.getElementById('io').value.trim();
  if(!t){toast('Вставь JSON-копию в поле ниже');return;}
  try{
    var d=JSON.parse(t);
    if(!d||!Array.isArray(d.log))throw 0;
    applyDump(d);
    save();renderStat();toast('Загружено: '+S.log.length+' тренировок, '+S.body.length+' замеров');
  }catch(e){toast('Не похоже на копию данных');}
}

/* ============ НАВИГАЦИЯ ============ */
function switchView(n){
  ['work','prog','body','stat'].forEach(function(x){
    document.getElementById('v-'+x).classList.toggle('on',x===n);
    document.querySelector('.nav [data-v="'+x+'"]').setAttribute('aria-current',x===n?'true':'false');
  });
  if(n==='prog')renderProg();
  if(n==='body')renderBody();
  if(n==='stat')renderStat();
  if(n==='work')renderWork();
  window.scrollTo(0,0);
}

/* ============ СТАРТ ============ */
store.get('gym:v2').then(function(d){
  if(!d) return store.get('gym:v1').then(function(o){
    if(o){S.log=o.log||[];S.body=o.body||[];}
    boot(true);
  });
  S.active=d.active||null;S.log=d.log||[];S.body=d.body||[];
  S.custom=d.custom||{};S.setsOv=d.setsOv||{};
  if(d.plan)S.plan=d.plan;
  S.planHist=d.planHist||{};S.bad=d.bad||{};S.weekOk=d.weekOk||{};
  if(d.sync)S.sync=d.sync;
  S.backupAt=d.backupAt||0;
  if(d.gain&&GAIN[d.gain])S.gain=d.gain;
  S.advice=d.advice||null;S.advSeen=d.advSeen||'';S.dismissed=d.dismissed||{};
  if(d.auto!==undefined)S.auto=!!d.auto;
  boot(false);
});
function boot(migrated){
  fixPlan();
  /* закрепляем прошлые недели, если они ещё не закреплены */
  if(backfillPlans())save();
  advOpen=advFresh();
  if(S.sync.path===undefined)S.sync.path='data.json';
  if(S.active){
    if(!S.active.w)S.active.w={};
    if(!S.active.swap)S.active.swap={};
    if(S.active.pAcc===undefined)S.active.pAcc=0;
    delete S.active.acc;delete S.active.seen;delete S.active.paused;
    accSaveAt=Date.now();
  }
  renderWork();
  paintRest();
  paintNetBar();probeNet(false);netWatch();
  if(S.active){
    setClock(true);wakeOn();
    toast('Тренировка восстановлена: '+Math.round(bumpElapsed()/60000)+' мин'+(isPaused()?' (пауза)':''));
  }
  else if(migrated&&S.log.length)toast('Данные из прошлой версии перенесены');
  /* тихо подтягиваем свежий разбор: если он не менялся, пользователь ничего не заметит */
  if(cloudReady())setTimeout(function(){cloudAdvice(true);},1200);
}
/* офлайн-режим */
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
