<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0F1215">
<title>Зал</title>
<link rel="manifest" href='data:application/json,{"name":"Зал","short_name":"Зал","start_url":".","display":"standalone","background_color":"%230F1215","theme_color":"%230F1215","icons":[]}'>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F1215; --surf:#181C20; --card:#191E22; --line:#2B3238;
  --tx:#E8EAE6; --mut:#8B939A; --dim:#5C666D;
  --ok:#4EA97B; --ok-bg:#14251D; --ok-br:#2C5A44;
  --dat:#5B9DD9; --wu:#6E7B85;
  --warn:#D9A23F; --warn-bg:#2A2113;
  --stop:#D9503F; --stop-bg:#2A1714;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5;padding-bottom:80px;overscroll-behavior-y:none}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}
button{font-family:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--dat);outline-offset:2px}

.top{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:640px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:12px}
.ttl{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:26px;letter-spacing:.02em;flex:1;line-height:1}
.ttl small{display:block;font-family:"IBM Plex Sans",sans-serif;font-weight:400;font-size:12px;color:var(--mut);letter-spacing:0;margin-top:2px}
.clock{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:22px;font-variant-numeric:tabular-nums;color:var(--ok)}
.clock.off{color:var(--dim)}

.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surf);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;background:none;border:0;padding:11px 2px 12px;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:13.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);border-top:2px solid transparent;margin-top:-1px}
.nav button[aria-current="true"]{color:var(--ok);border-top-color:var(--ok)}

.view{display:none;padding-top:16px}
.view.on{display:block}

.motd{background:var(--card);border-left:3px solid var(--ok);border-radius:0 4px 4px 0;padding:11px 13px;margin-bottom:18px;font-size:14.5px;color:var(--mut);line-height:1.45}
.pick{display:grid;gap:9px;margin-bottom:20px}
.pick button{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:14px;text-align:left;display:flex;align-items:center;gap:13px;width:100%}
.pick.home button{padding:12px 14px}
.pick .dn{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:31px;line-height:1;color:var(--ok);width:32px;flex:0 0 auto}
.pick.home .dn{font-size:22px;color:var(--dat);width:26px}
.pick .dd{flex:1;min-width:0}
.pick .dd b{display:block;font-weight:600;font-size:16.5px;margin-bottom:2px}
.pick .dd span{font-size:13px;color:var(--mut)}
.pick .dd em{display:block;font-style:normal;font-size:12.5px;color:var(--dim);margin-top:3px}
.hdr{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0 0 8px}

.ex{background:var(--card);border:1px solid var(--line);border-radius:4px;margin-bottom:10px;overflow:hidden}
.ex.done{background:var(--ok-bg);border-color:var(--ok-br)}
.exh{padding:12px 13px 9px;display:flex;gap:11px;align-items:flex-start}
.exn{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:21px;color:var(--dim);width:20px;flex:0 0 auto;line-height:1.15;padding-top:2px}
.ex.done .exn{color:var(--ok)}
.ext{flex:1;min-width:0}
.ext h3{font-size:16.5px;font-weight:600;margin:0 0 3px;line-height:1.25}
.tgt{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:15px;letter-spacing:.05em;text-transform:uppercase;color:var(--dat)}
.grp{color:var(--dim);margin-left:7px}
.pr{display:inline-block;margin-left:6px;background:var(--ok);color:#0F1215;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:12px;letter-spacing:.08em;padding:1px 6px;border-radius:2px;vertical-align:1px}
.hint{font-size:13.5px;color:var(--mut);line-height:1.4;padding:0 13px 6px 44px;margin:0}
.e1{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--dat);padding:0 13px 8px 44px}
.mynote{background:rgba(91,157,217,.09);border-left:2px solid var(--dat);margin:0 13px 9px 44px;padding:6px 9px;font-size:13.5px;color:var(--tx);border-radius:0 3px 3px 0}

.tech-btn{display:block;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:9px 13px;text-align:left;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:14px;letter-spacing:.11em;text-transform:uppercase;color:var(--mut)}
.tech-btn::after{content:" ▾";color:var(--dim)}
.tech-btn[aria-expanded="true"]::after{content:" ▴"}
.tech{display:none;padding:2px 13px 14px;border-top:1px solid var(--line);font-size:14.5px}
.tech.open{display:block}
.tech .lb{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:13px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);margin:13px 0 5px}
.tech ol{margin:0;padding-left:19px}
.tech ol li{margin-bottom:6px}
.tech ul{margin:0;padding:0;list-style:none}
.tech ul li{padding-left:15px;margin-bottom:6px;position:relative}
.tech ul li::before{content:"";position:absolute;left:0;top:10px;width:7px;height:1.5px;background:var(--dat)}
.tech .stop{background:var(--stop-bg);border-left:3px solid var(--stop);padding:9px 11px;margin-top:13px}
.tech .stop .lb{color:var(--stop);margin:0 0 3px}
.tech .stop p{margin:0}
.tech .nt{margin:13px 0 0;color:var(--mut);font-size:13.5px}
.rest{display:inline-block;background:var(--surf);border:1px solid var(--line);border-radius:3px;padding:3px 9px;font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--tx);margin-top:4px}

.sets{padding:2px 9px 4px}
.sect{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);padding:7px 4px 3px}
.row{display:flex;align-items:center;gap:6px;padding:4px;border-radius:4px}
.row.filled{background:rgba(78,169,123,.13)}
.row.wu.filled{background:rgba(110,123,133,.14)}
.row.warn{background:var(--stop-bg);box-shadow:inset 0 0 0 1px var(--stop)}
.si{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--dim);width:19px;flex:0 0 auto;text-align:center}
.row.wu .si{color:var(--wu)}
.fld{display:flex;align-items:center;flex:1;min-width:0}
.fld button{background:var(--surf);border:1px solid var(--line);color:var(--mut);width:29px;height:38px;font-size:17px;line-height:1;flex:0 0 auto;padding:0;font-family:"IBM Plex Mono",monospace}
.fld button:first-of-type{border-radius:4px 0 0 4px}
.fld button:last-of-type{border-radius:0 4px 4px 0}
.fld input{flex:1;min-width:0;width:100%;height:38px;background:var(--surf);border:1px solid var(--line);border-left:0;border-right:0;color:var(--tx);font-family:"IBM Plex Mono",monospace;font-weight:500;font-size:16px;text-align:center;padding:0 2px}
.fld input:focus{outline:none;border-color:var(--dat);background:#1E252B}
.fld input:disabled,.fld button:disabled{opacity:.55;color:var(--mut)}
.un{font-family:"Barlow Condensed",sans-serif;font-size:12.5px;color:var(--dim);width:15px;flex:0 0 auto}
.chk{width:40px;height:38px;flex:0 0 auto;border-radius:4px;background:var(--surf);border:1px solid var(--line);font-size:17px;color:var(--dim);padding:0;line-height:1}
.chk.on{background:var(--ok);border-color:var(--ok);color:#0F1215;font-weight:700}
.row.wu .chk.on{background:var(--wu);border-color:var(--wu);color:#0F1215}
.prev{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--dim);padding:0 4px 3px 29px}
.wmsg{font-size:12.5px;color:var(--stop);padding:1px 4px 5px 29px}
.setbtns{display:flex;gap:7px;padding:6px 4px 8px}
.setbtns button{background:var(--surf);border:1px solid var(--line);border-radius:4px;padding:6px 12px;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}

.big{display:block;width:100%;border:0;border-radius:4px;padding:15px;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:20px;letter-spacing:.09em;text-transform:uppercase}
.big.go{background:var(--ok);color:#0F1215}
.big.fin{background:var(--surf);color:var(--tx);border:1px solid var(--line)}
.big.dan{background:none;color:var(--stop);border:1px solid var(--stop);font-size:15px;padding:11px}
.big.armed{background:var(--stop);color:#fff;border-color:var(--stop)}
.gap{margin-top:12px}
.sm{display:inline-block;width:auto;padding:9px 13px;font-size:14px;background:var(--surf);border:1px solid var(--line);border-radius:4px;font-family:"Barlow Condensed",sans-serif;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}

h4{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:21px;margin:24px 0 10px;letter-spacing:.02em}
h4:first-child{margin-top:0}
.sub{font-size:13.5px;color:var(--mut);margin:-6px 0 12px;line-height:1.45}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:11px 10px}
.kpi b{display:block;font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:21px;line-height:1.1;margin-bottom:3px}
.kpi span{font-size:11.5px;color:var(--mut);line-height:1.25;display:block}
.kpi.hl b{color:var(--ok)}
.bar{margin-bottom:9px}
.bar-t{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;margin-bottom:4px}
.bar-t b{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:15px}
.bar-t b i{font-style:normal;color:var(--dim);font-size:12.5px;font-weight:400}
.track{height:8px;background:var(--surf);border-radius:2px;overflow:hidden;display:flex}
.track i{display:block;height:100%;background:var(--dat);border-radius:2px}
.track i.pw{background:var(--line)}

select,input[type=date],input[type=number],input.txt{width:100%;background:var(--surf);color:var(--tx);border:1px solid var(--line);border-radius:4px;padding:11px 10px;font-family:inherit;font-size:15px;margin-bottom:12px}
.chart{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:12px 10px 8px;margin-bottom:12px}
.chart h5{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:14px;letter-spacing:.11em;text-transform:uppercase;color:var(--mut);margin:0 0 8px;padding:0 3px}
.chart svg{display:block;width:100%;height:auto}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);text-align:left;padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
td.n{font-family:"IBM Plex Mono",monospace;font-size:13.5px;color:var(--mut)}
.hist{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line);align-items:baseline}
.hist .hd{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:18px;color:var(--ok);width:22px;flex:0 0 auto}
.hist .hd.h{color:var(--dat);font-size:15px}
.hist .hb{flex:1;min-width:0}
.hist .hb b{display:block;font-weight:500;font-size:15px}
.hist .hb span{font-size:12.5px;color:var(--mut);font-family:"IBM Plex Mono",monospace}
.empty{color:var(--dim);font-size:14.5px;padding:22px 0;text-align:center;line-height:1.6}

/* календарь */
.cal{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:10px;margin-bottom:12px}
.calnav{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.calnav b{flex:1;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:18px;text-align:center;text-transform:capitalize}
.calnav button{background:var(--surf);border:1px solid var(--line);border-radius:4px;width:34px;height:32px;color:var(--mut);font-size:16px;padding:0}
.calrow{display:grid;grid-template-columns:repeat(7,1fr) 30px;gap:3px;align-items:center}
.calrow.head span{font-family:"Barlow Condensed",sans-serif;font-size:12px;color:var(--dim);text-align:center;text-transform:uppercase;letter-spacing:.06em;padding-bottom:2px}
.cd{aspect-ratio:1;border-radius:3px;background:var(--surf);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--mut);position:relative;min-height:34px}
.cd.out{opacity:.28}
.cd.today{box-shadow:inset 0 0 0 1.5px var(--tx)}
.cd .dots{display:flex;gap:2px;margin-top:2px;height:5px}
.cd .dots i{width:5px;height:5px;border-radius:50%;display:block}
.cd .dots i.g{background:var(--ok)}
.cd .dots i.h{background:var(--dat)}
.wst{width:26px;height:26px;border-radius:3px;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;color:#0F1215}
.wst.g{background:var(--ok)} .wst.y{background:var(--warn)} .wst.r{background:var(--stop);color:#fff} .wst.n{background:var(--line);color:var(--dim)}
.leg{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--mut);margin-top:9px}
.leg span{display:flex;align-items:center;gap:5px}
.leg i{width:9px;height:9px;border-radius:2px;display:block}

/* модалка */
.mask{position:fixed;inset:0;background:rgba(6,8,10,.82);z-index:50;display:none;align-items:flex-end;justify-content:center;padding:0}
.mask.on{display:flex}
.modal{background:var(--bg);border-top:1px solid var(--line);border-radius:10px 10px 0 0;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;padding:18px 16px calc(20px + env(safe-area-inset-bottom))}
.modal h3{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:25px;margin:0 0 4px}
.modal p.sub{margin:0 0 16px}
.mlab{font-size:14px;font-weight:500;margin-bottom:4px;display:block}
.mlab em{font-style:normal;color:var(--dim);font-size:12.5px;display:block}
.done-list{margin:0 0 16px;padding:0;list-style:none}
.done-list li{display:flex;gap:9px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.done-list li b{font-family:"IBM Plex Mono",monospace;font-weight:600;color:var(--ok);flex:0 0 auto}

.bf{margin-bottom:11px}
.bf label{display:block;font-size:14px;font-weight:500}
.bf label em{display:block;font-style:normal;font-size:11.5px;color:var(--dim);line-height:1.35;margin-top:1px}
.bf .fld{margin-top:5px}
textarea{width:100%;background:var(--surf);color:var(--tx);border:1px solid var(--line);border-radius:4px;padding:10px;font-family:inherit;font-size:14.5px;line-height:1.45;margin-bottom:10px;resize:vertical}
textarea.io{height:120px;font-family:"IBM Plex Mono",monospace;font-size:12px}
textarea.small{height:74px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;z-index:60;background:#2A3138;color:#fff;padding:11px 18px;border-radius:4px;font-size:14.5px;box-shadow:0 6px 24px rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s;max-width:88%;text-align:center}
.toast.on{opacity:1}
.toast.pr{background:var(--ok);color:#0F1215;font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="top"><div class="top-in">
  <div class="ttl">Зал<small id="sub">Выбери тренировку</small></div>
  <div class="clock off mono" id="clock">--:--</div>
</div></div>

<main>
  <section class="view on wrap" id="v-work"></section>
  <section class="view wrap" id="v-prog"></section>
  <section class="view wrap" id="v-body"></section>
  <section class="view wrap" id="v-stat"></section>
</main>

<nav class="nav">
  <button data-v="work" aria-current="true">Тренировка</button>
  <button data-v="prog" aria-current="false">Прогресс</button>
  <button data-v="body" aria-current="false">Тело</button>
  <button data-v="stat" aria-current="false">Итоги</button>
</nav>

<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============ ХРАНИЛИЩЕ ============ */
var store=(function(){
  var ws=(typeof window!=='undefined')&&window.storage&&typeof window.storage.get==='function';
  var LS='local'+'Storage';
  return{
    get:function(k){
      if(ws)return window.storage.get(k,false).then(function(r){return r&&r.value?JSON.parse(r.value):null;}).catch(function(){return null;});
      return new Promise(function(res){try{var v=window[LS].getItem(k);res(v?JSON.parse(v):null);}catch(e){res(null);}});
    },
    set:function(k,v){
      var s=JSON.stringify(v);
      if(ws)return window.storage.set(k,s,false).catch(function(){});
      return new Promise(function(res){try{window[LS].setItem(k,s);}catch(e){}res();});
    }
  };
})();

/* ============ УПРАЖНЕНИЯ ============ */
var EX={
/* --- ЗАЛ --- */
incline_db:{name:'Жим гантелей лёжа под наклоном',grp:'Грудь',start:26,step:2,hand:1,e1:1,rest:'2–3 мин',
 wu:[{p:.4,r:12},{p:.65,r:6}],
 hint:'Наклон 30°. Опускать до уровня ключиц, локти под 45°.',
 how:['Наклон скамьи 30°, не выше — 45° уводит нагрузку в передние дельты.','Сведи лопатки и прижми к скамье ДО того, как возьмёшь гантели. Держи так весь подход.','Локти под 45° к корпусу, не разводи на 90°.','Внизу гантели на уровне ключиц, короткая пауза. Вверху не сталкивай их друг с другом.'],
 watch:['Стопы на полу, поясница в естественном прогибе. Мост не выгибай.','Опускание контролируемое — растяжение груди внизу и есть основной стимул.']},
cable_fly:{name:'Сведение рук в кроссовере',grp:'Грудь',start:18,step:2.5,rest:'60–90 сек',
 wu:[{p:.5,r:15}],
 hint:'Локоть согнут и зафиксирован. Руки сходятся чуть за среднюю линию.',
 how:['Блоки на уровне плеч или чуть ниже. Ноги раздельно, одна впереди.','Локти слегка согнуты и зафиксированы под одним углом весь подход.','Разведение 3 сек, в точке растяжения пауза 1 сек.','Своди руки чуть за среднюю линию, с лёгким перекрестом. Пауза 1 сек.'],
 watch:['Локоть разгибается в конце — это уже жим, работу забирает трицепс.','Чувствуешь передние дельты вместо груди — блоки стоят слишком высоко.','Наклон корпуса идёт от таза, поясница нейтральна.']},
bb_curl:{name:'Подъём штанги на бицепс',grp:'Бицепс',start:35,step:2.5,min:20,e1:1,rest:'90 сек',
 wu:[{p:.5,r:12}],
 hint:'Локти прижаты и неподвижны. Корпус не раскачивается.',

pulldown:{name:'Тяга верхнего блока',grp:'Спина',start:59,step:5,e1:1,rest:'2 мин',

 watch:['Не раскачивайся корпусом.','За голову не тяни.']},

farmer:{name:'Прогулка фермера одной рукой',grp:'Кор',start:24,step:2,unit:'сек',repdef:60,repstep:15,rest:'90 сек',

bench:{name:'Жим лёжа, штанга',grp:'Грудь',start:85,step:2.5,min:20,e1:1,rest:'3 мин',

hanging_leg:{name:'Подъём ног в висе',grp:'Пресс',bw:1,start:0,step:2,rest:'60–90 сек',

h_hip:{name:'Сгибатели бедра в выпаде',grp:'Мобильность',noW:1,unit:'сек',repdef:60,repstep:15,rest:'без паузы',

h_tspine:{name:'Грудной отдел на валике',grp:'Мобильность',noW:1,unit:'сек',repdef:20,repstep:10,rest:'без паузы',
 hint:'Валик под лопатками, таз прижат к полу. 3 позиции по 20 сек.',

h_book:{name:'Открытая книга',grp:'Мобильность',noW:1,repdef:8,rest:'без паузы',
 hint:'Колени прижаты, разворачивается только грудная клетка.',
 how:['Ляг на бок, колени согнуты 90°, под верхнее колено подушка.','Руки вытянуты вперёд, ладонь на ладони.','На выдохе раскрывай верхнюю руку назад, взгляд за кистью.','Задержись 2 сек, вернись. 8 раз, потом другая сторона.'],
 watch:['Колени не отрываются друг от друга.','Веди грудной клеткой, а не тянись рукой.']},
h_door:{name:'Грудные в дверном проёме',grp:'Мобильность',noW:1,unit:'сек',repdef:45,repstep:15,rest:'без паузы',

h_ham:{name:'Задняя поверхность бедра лёжа',grp:'Мобильность',noW:1,unit:'сек',repdef:45,repstep:15,rest:'без паузы',

 watch:['Поясница прижата к полу всё время.','Тянет под коленом и по середине задней поверхности.'],

h_deadbug:{name:'Dead bug',grp:'Кор',noW:1,repdef:10,rest:'45 сек',

h_bridge:{name:'Ягодичный мостик',grp:'Кор',start:0,step:2,repdef:15,rest:'45 сек',

 watch:['Чувствуешь поясницу — не подкрутил таз или поднялся выше линии.','Сводит заднюю поверхность — подвинь стопы ближе.']},

function toast(m,pr){
  var t=document.getElementById('toast');
  t.textContent=m;t.className='toast on'+(pr?' pr':'');
  clearTimeout(t._h);t._h=setTimeout(function(){t.className='toast'+(pr?' pr':'');},pr?3000:2200);

function pad(n){return n<10?'0'+n:''+n;}
function hhmm(ms){var s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return (h>0?h+':'+pad(m):pad(m))+':'+pad(s%60);}
function dur(ms){var m=Math.round(ms/60000);return m>=60?Math.floor(m/60)+' ч '+(m%60)+' мин':m+' мин';}
function dstr(ts){var d=new Date(ts);return pad(d.getDate())+'.'+pad(d.getMonth()+1);}
function dwd(ts){var d=new Date(ts);return WD[(d.getDay()+6)%7]+', '+pad(d.getDate())+'.'+pad(d.getMonth()+1);}
function iso(ts){var d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function weekKey(ts){var d=new Date(ts);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime();}
function num(v){var x=parseFloat(String(v).replace(',','.'));return isFinite(x)?x:0;}
function fmtW(x){return (Math.round(x*100)/100).toString().replace('.',',');}
function roundTo(v,st,mn){var r=Math.round(v/st)*st;if(mn&&r<mn)r=mn;return Math.max(0,r);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function bodyW(){
  var w=S.body.filter(function(x){return x.w;}).sort(function(a,b){return a.d<b.d?-1:1;});
  return w.length?w[w.length-1].w:82;
}
function setsOf(dayKey,item){return S.setsOv[item.id]||item.sets;}
function e1rm(w,r,m){
  if(!m.e1)return 0;
  var base=m.bw?bodyW()+w:(m.hand?w:w);
  if(!base||!r)return 0;
  return base*(1+r/30);
}
function lastDone(exId,key){
  for(var i=S.log.length-1;i>=0;i--){var e=(S.log[i][key]||{})[exId];if(e&&e.length)return e;}
  return null;
}
function bestEver(exId){
  var m=EX[exId],b=0;
  S.log.forEach(function(x){(x.e[exId]||[]).forEach(function(s){var v=e1rm(s.w,s.r,m);if(v>b)b=v;});});
  return b;
}

    var doneN=sArr.filter(function(s){return s&&s.d;}).length;

    var base=(sArr[0]&&sArr[0].w)||(prevS&&prevS[0]?prevS[0].w:0)||(m.bw||m.noW?0:m.start);
    var cust=S.custom[item.id]||{};

    /* лучший e1RM в текущей сессии */
    var cur1=0;sArr.forEach(function(s){if(s&&s.d){var q=e1rm(s.w,s.r,m);if(q>cur1)cur1=q;}});

function setRow(m,kind,j,wv,rv,done,pv,warn){
  var lock=done?' disabled':'';
  var lbl=kind==='w'?'Р'+(j+1):(j+1);
  var s='<div class="row'+(kind==='w'?' wu':'')+(done?' filled':'')+(warn?' warn':'')+'" data-k="'+kind+'" data-i="'+j+'">'+
    '<span class="si">'+lbl+'</span>';
  if(m.noW){
    s+='<span class="fld" style="flex:0 0 0;width:0;overflow:hidden"></span>';
  }else{
    s+='<span class="fld"><button data-a="w-"'+lock+'>−</button><input type="text" inputmode="decimal" data-f="w" value="'+fmtW(wv)+'"'+lock+'><button data-a="w+"'+lock+'>+</button></span><span class="un">'+(m.bw?'+кг':'кг')+'</span>';
  }
  s+='<span class="fld"><button data-a="r-"'+lock+'>−</button><input type="text" inputmode="numeric" data-f="r" value="'+rv+'"'+lock+'><button data-a="r+"'+lock+'>+</button></span><span class="un">'+(m.unit||'пв')+'</span>'+
    '<button class="chk'+(done?' on':'')+'" data-a="ok">'+(done?'✓':'○')+'</button></div>';
  if(pv&&!m.noW) s+='<div class="prev">прошлый раз: '+fmtW(pv.w)+(m.bw?'':' кг')+' × '+pv.r+'</div>';
  else if(pv) s+='<div class="prev">прошлый раз: '+pv.r+'</div>';
  if(warn) s+='<div class="wmsg">Сильное отклонение от прошлой тренировки — проверь цифры</div>';
  return s;
}

function techHtml(m,id){
  var c=S.custom[id]||{};
  var h='';
  if(m.rest) h+='<div class="lb">Отдых между подходами</div><span class="rest">'+m.rest+'</span>';
  h+='<div class="lb">Как делать</div><ol>';
  m.how.forEach(function(x){h+='<li>'+x+'</li>';});
  h+='</ol>';
  if(m.watch&&m.watch.length){h+='<div class="lb">Следи за</div><ul>';m.watch.forEach(function(x){h+='<li>'+x+'</li>';});h+='</ul>';}
  if(m.stop)h+='<div class="stop"><div class="lb">Стоп</div><p>'+m.stop+'</p></div>';
  if(m.note)h+='<p class="nt">'+m.note+'</p>';
  h+='<div class="lb">Моя техника</div>'+
     '<textarea class="small" data-tech="'+id+'" placeholder="Свои заметки по технике — сохраняются автоматически">'+esc(c.tech||'')+'</textarea>';

function setClock(t){
  var c=document.getElementById('clock');
  clearInterval(tick);tick=null;
  if(!t){c.textContent='--:--';c.classList.add('off');return;}
  c.classList.remove('off');
  function up(){c.textContent=hhmm(Date.now()-t);}
  up();tick=setInterval(up,1000);
}

document.addEventListener('click',function(ev){
  var b=ev.target.closest('button');
  if(!b){disarm();return;}
  if(armed&&armed.el!==b)disarm();
  if(b.dataset.start){startDay(b.dataset.start);return;}
  if(b.dataset.v){switchView(b.dataset.v);return;}
  var a=b.dataset.a;if(!a)return;

  if(a==='tech'){var op=b.getAttribute('aria-expanded')==='true';b.setAttribute('aria-expanded',op?'false':'true');b.nextElementSibling.classList.toggle('open',!op);return;}
  if(a==='finish'){var n=countActive();if(!n){toast('Нет ни одного отмеченного подхода');return;}openFinish();return;}
  if(a==='drop'){
    if(armed&&armed.el===b){disarm();S.active=null;save();renderWork();setClock(null);toast('Тренировка отменена');}
    else arm(b,'Точно отменить? Всё сотрётся');return;}
  if(a==='fsave'){doFinish();return;}
  if(a==='mclose'){closeModal();return;}
  if(a==='note'){openNote(b.closest('.ex').dataset.ex);return;}
  if(a==='nsave'){saveNote();return;}
  if(a==='set+'||a==='set-'){
    var exId=b.closest('.ex').dataset.ex;
    var it=DAYS[S.active.day].ex.filter(function(x){return x.id===exId;})[0];
    var cur=setsOf(S.active.day,it);
    var nv=a==='set+'?cur+1:cur-1;
    if(nv<1){toast('Минимум один подход');return;}
    if(nv>12){toast('Больше 12 подходов не нужно');return;}
    S.setsOv[exId]=nv;save();renderWork();return;}
  if(a==='bm'){var bi=document.getElementById('b_'+b.dataset.k);bi.value=fmtW(Math.max(0,num(bi.value)+parseFloat(b.dataset.s)));return;}
  if(a==='bsave'){saveBody();return;}
  if(a==='bdel'){if(armed&&armed.el===b){var dd=b.dataset.d;disarm();S.body=S.body.filter(function(x){return x.d!==dd;});save();renderBody();toast('Запись удалена');}else arm(b,'Удалить?');return;}
  if(a==='dellast'){
    if(armed&&armed.el===b){disarm();var l=S.log.pop();save();renderStat();toast('Удалено: '+DAYS[l.day].t+' от '+dstr(l.s));}
    else arm(b,'Удалить последнюю?');return;}
  if(a==='cal'){calM=+b.dataset.m;renderStat();return;}
  if(a==='exp'){doExport();return;}
  if(a==='expcsv'){doCsv();return;}
  if(a==='expai'){doAi();return;}
  if(a==='imp'){doImport();return;}
  if(a==='wipe'){if(armed&&armed.el===b){disarm();S.log=[];S.body=[];S.active=null;save();renderStat();toast('Все данные удалены');}else arm(b,'Стереть всё безвозвратно?');return;}

  var row=b.closest('.row');if(!row)return;
  var exId2=b.closest('.ex').dataset.ex,idx=+row.dataset.i,kind=row.dataset.k,m=EX[exId2];
  var wIn=row.querySelector('[data-f="w"]'),rIn=row.querySelector('[data-f="r"]');

  if(a==='w-'||a==='w+'){var st=m.step||2.5;wIn.value=fmtW(Math.max(0,num(wIn.value)+(a==='w+'?st:-st)));commit(exId2,kind,idx,row);return;}
  if(a==='r-'||a==='r+'){var rs=m.repstep||1;rIn.value=Math.max(0,num(rIn.value)+(a==='r+'?rs:-rs));commit(exId2,kind,idx,row);return;}
  if(a==='ok'){
    var bank=kind==='w'?S.active.w:S.active.e;
    var arr=bank[exId2]=bank[exId2]||[];
    var cur=arr[idx]||{},nd=!cur.d;
    var wv=wIn?num(wIn.value):0,rv=num(rIn.value);
    var warn=false;
    if(nd&&kind==='s'){
      var pv=lastDone(exId2,'e'),p=pv&&pv[idx]?pv[idx]:null;
      if(p){
        if(!m.noW&&p.w>0&&Math.abs(wv-p.w)/p.w>0.35)warn=true;
        if(p.r>0&&Math.abs(rv-p.r)/p.r>0.6)warn=true;
      }
      if(wv>400||rv>120)warn=true;
      var before=bestEver(exId2),now=e1rm(wv,rv,m);
      if(m.e1&&now>0&&before>0&&now>before+0.5) setTimeout(function(){toast('Рекорд! Расчётный 1ПМ: '+Math.round(now)+' кг',1);},80);
    }
    arr[idx]={w:wv,r:rv,d:nd,warn:warn};
    save();renderWork();return;
  }
});

function commit(exId,kind,idx,row){
  if(!S.active)return;
  var bank=kind==='w'?S.active.w:S.active.e;
  var arr=bank[exId]=bank[exId]||[];
  var cur=arr[idx]||{},wq=row.querySelector('[data-f="w"]');
  arr[idx]={w:wq?num(wq.value):0,r:num(row.querySelector('[data-f="r"]').value),d:!!cur.d,warn:!!cur.warn};
  save();
}

/* ============ РАСЧЁТЫ ============ */
function countSets(x){var n=0;Object.keys(x.e).forEach(function(k){n+=x.e[k].length;});return n;}
function tonnage(x){
  var t=0;
  Object.keys(x.e).forEach(function(k){
    var m=EX[k];if(!m||m.unit==='сек'||m.noW)return;
    var mu=m.hand?2:1;
    x.e[k].forEach(function(s){t+=(m.bw?bodyW()+s.w:s.w)*s.r*mu;});
  });
  return t;
}
function groupWeek(wk){
  var g={};GROUPS.forEach(function(x){g[x]=0;});
  S.log.forEach(function(x){
    if(weekKey(x.s)!==wk)return;
    Object.keys(x.e).forEach(function(k){var m=EX[k];if(m&&g[m.grp]!==undefined)g[m.grp]+=x.e[k].length;});
  });
  return g;
}
/* Индекс силы: среднее по упражнениям отношение текущего лучшего e1RM к первому. 100 = старт */
function strengthIndex(){
  var base={},pts=[],best={};
  S.log.forEach(function(sess){
    Object.keys(sess.e).forEach(function(k){
      var m=EX[k];if(!m||!m.e1)return;
      var b=0;sess.e[k].forEach(function(s){var q=e1rm(s.w,s.r,m);if(q>b)b=q;});
      if(!b)return;
      if(!base[k])base[k]=b;
      if(!best[k]||b>best[k])best[k]=b;
    });
    var ks=Object.keys(best);
    if(!ks.length)return;
    var sum=0;ks.forEach(function(k){sum+=best[k]/base[k];});
    pts.push({x:dstr(sess.s),y:Math.round(sum/ks.length*1000)/10});
  });
  return pts;
}
function weekStatus(wk){
  var ss=S.log.filter(function(x){return weekKey(x.s)===wk;});
  if(!ss.length&&wk>=weekKey(Date.now()))return 'n';
  var gym=ss.filter(function(x){return (x.type||DAYS[x.day].type)==='gym';}).length;
  var homeNeed=S.plan.mob+S.plan.core+S.plan.wheel+S.plan.prio;
  var home=ss.length-gym;
  if(gym<S.plan.gym)return 'r';
  if(home<homeNeed)return 'y';
  return 'g';
}
function streak(){
  var wk=weekKey(Date.now())-7*864e5,n=0;
  while(true){
    var st=weekStatus(wk);
    if(st==='g'){n++;wk-=7*864e5;}else break;
    if(n>200)break;
  }
  return n;
}

/* ============ ГРАФИК ============ */
function lineChart(pts,color,unit){
  if(!pts.length)return '<p class="empty">Пока нет данных</p>';
  var W=560,H=180,pl=46,pr=12,pt=16,pb=26;
  var ys=pts.map(function(p){return p.y;});
  var mn=Math.min.apply(null,ys),mx=Math.max.apply(null,ys);
  if(mx===mn)mx=mn+(mn===0?1:Math.abs(mn)*.08);
  var lo=mn,pd=(mx-mn)*.15;mn-=pd;mx+=pd;if(mn<0&&lo>=0)mn=0;
  function X(i){return pts.length===1?pl+(W-pl-pr)/2:pl+i*(W-pl-pr)/(pts.length-1);}
  function Y(v){return pt+(1-(v-mn)/(mx-mn))*(H-pt-pb);}
  var g='';
  [0,.5,1].forEach(function(f){
    var v=mn+(mx-mn)*f,y=Y(v);
    g+='<line x1="'+pl+'" y1="'+y+'" x2="'+(W-pr)+'" y2="'+y+'" stroke="#2B3238" stroke-width="1"/>'+
       '<text x="'+(pl-6)+'" y="'+(y+4)+'" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="11" fill="#5C666D">'+(Math.round(v*10)/10)+'</text>';
  });
  var d=pts.map(function(p,i){return (i?'L':'M')+X(i).toFixed(1)+' '+Y(p.y).toFixed(1);}).join(' ');
  g+='<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  var ev=Math.ceil(pts.length/6);
  pts.forEach(function(p,i){
    g+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="3.5" fill="'+color+'"/>';
    if(i%ev===0||i===pts.length-1)g+='<text x="'+X(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="#5C666D">'+p.x+'</text>';
  });
  g+='<text x="'+(W-pr)+'" y="'+pt+'" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="600" fill="'+color+'">'+(Math.round(pts[pts.length-1].y*100)/100)+' '+unit+'</text>';
  return '<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">'+g+'</svg>';
}

var progSel='incline_db';
function renderProg(){
  var v=document.getElementById('v-prog'),ids=[];
  Object.keys(DAYS).forEach(function(k){DAYS[k].ex.forEach(function(x){if(ids.indexOf(x.id)<0)ids.push(x.id);});});
  var h='<select id="psel">';
  ids.forEach(function(id){h+='<option value="'+id+'"'+(id===progSel?' selected':'')+'>'+EX[id].name+'</option>';});
  h+='</select>';
  var m=EX[progSel],rows=[];
  S.log.forEach(function(x){var e=x.e[progSel];if(e&&e.length){var b=null;e.forEach(function(s){if(!b||(m.noW||m.bw?s.r>b.r:s.w>b.w||(s.w===b.w&&s.r>b.r)))b=s;});rows.push({ts:x.s,sets:e,best:b});}});
  if(!rows.length){h+='<p class="empty">По этому упражнению пока нет записей.</p>';v.innerHTML=h;bindSel();return;}
  if(m.e1){
    h+='<div class="chart"><h5>Расчётный 1ПМ, кг</h5>'+lineChart(rows.map(function(r){
      var b=0;r.sets.forEach(function(s){var q=e1rm(s.w,s.r,m);if(q>b)b=q;});return{x:dstr(r.ts),y:Math.round(b*10)/10};}),'#4EA97B','кг')+'</div>';
  }
  h+='<div class="chart"><h5>'+((m.bw||m.noW)?'Лучший подход, повторов':'Рабочий вес, кг')+'</h5>'+
     lineChart(rows.map(function(r){return{x:dstr(r.ts),y:(m.bw||m.noW)?r.best.r:r.best.w};}),'#E0A33E',(m.bw||m.noW)?'пв':'кг')+'</div>';
  if(!m.noW&&m.unit!=='сек'){
    h+='<div class="chart"><h5>Объём за тренировку, кг</h5>'+lineChart(rows.map(function(r){
      var mu=m.hand?2:1,t=0;r.sets.forEach(function(s){t+=(m.bw?bodyW()+s.w:s.w)*s.r*mu;});return{x:dstr(r.ts),y:Math.round(t)};}),'#5B9DD9','кг')+'</div>';
  }
  h+='<h4>Последние тренировки</h4><p class="sub">Только рабочие подходы</p><table><tr><th>Дата</th><th>Подходы</th></tr>';
  rows.slice(-14).reverse().forEach(function(r){
    var t=r.sets.map(function(s){return m.noW?s.r:((m.bw&&s.w>0?'+'+fmtW(s.w)+'×':m.bw?'':fmtW(s.w)+'×'))+s.r;}).join('   ');
    h+='<tr><td class="n">'+dwd(r.ts)+'</td><td class="n" style="color:var(--tx)">'+t+'</td></tr>';
  });
  h+='</table>';
  v.innerHTML=h;bindSel();
}
function bindSel(){var s=document.getElementById('psel');if(s)s.addEventListener('change',function(){progSel=s.value;renderProg();});}

function saveBody(){
  var d=document.getElementById('bdate').value;
  if(!d){toast('Укажи дату');return;}
  var rec={d:d},any=false;
  BODY.forEach(function(f){var raw=document.getElementById('b_'+f.k).value.trim();if(raw!==''){rec[f.k]=num(raw);any=true;}});
  if(!any){toast('Заполни хотя бы одно поле');return;}
  S.body=S.body.filter(function(x){return x.d!==d;});
  S.body.push(rec);save();renderBody();toast('Замер сохранён: '+d);window.scrollTo(0,0);
}

function renderStat(){
  var v=document.getElementById('v-stat'),h='';
  var tw=weekKey(Date.now()),pw=tw-7*864e5;
  var ws=S.log.filter(function(x){return weekKey(x.s)===tw;});

  var si=strengthIndex();
  h+='<h4>Индекс силы</h4><p class="sub">Средний рост расчётного 1ПМ по всем базовым упражнениям. 100 — твой старт. Растёт только когда растут веса и повторы, объём сам по себе его не двигает.</p>';

    '<div class="kpi'+(gymW>=S.plan.gym?' hl':'')+'"><b>'+gymW+'/'+S.plan.gym+'</b><span>зал</span></div>'+

  h+='<div class="kpis" style="margin-top:8px">'+

    '<div class="kpi"><b>'+(Math.round(ws.reduce(function(a,x){return a+tonnage(x);},0)/100)/10)+'т</b><span>тоннаж</span></div>'+
    '<div class="kpi"><b>'+ws.reduce(function(a,x){return a+(x.kcal||0);},0)+'</b><span>ккал</span></div></div>';

  /* календарь */
  var now=new Date();
  if(calM===null)calM=now.getFullYear()*12+now.getMonth();
  var yy=Math.floor(calM/12),mm=calM%12;

     '<div class="calnav"><button data-a="cal" data-m="'+(calM-1)+'">‹</button><b>'+MN[mm]+' '+yy+'</b><button data-a="cal" data-m="'+(calM+1)+'">›</button></div>'+
     '<div class="calrow head">'+WD.map(function(w){return '<span>'+w+'</span>';}).join('')+'<span></span></div>';

  var cur=new Date(start),tod=iso(Date.now());

     '<tr><th>Что</th><th>В неделю</th></tr>'+
     planRow('gym','Зал (день A + день B)')+planRow('mob','Мобильность')+planRow('core','Кор и спина')+
     planRow('wheel','Ролик')+planRow('prio','Приоритет')+'</table></div>';

  /* всего */
  if(S.log.length){
    var tt=S.log.reduce(function(a,x){return a+tonnage(x);},0);
    var gy=S.log.filter(function(x){return (x.type||DAYS[x.day].type)==='gym';});
    var ad=gy.length?gy.reduce(function(a,x){return a+(x.f-x.s);},0)/gy.length:0;
    h+='<h4>Всего</h4><div class="kpis">'+
      '<div class="kpi"><b>'+S.log.length+'</b><span>тренировок</span></div>'+
      '<div class="kpi"><b>'+(Math.round(tt/100)/10)+'т</b><span>поднято</span></div>'+
      '<div class="kpi"><b>'+Math.round(ad/60000)+'</b><span>мин в зале<br>в среднем</span></div></div>';
    h+='<h4>История</h4>';
    S.log.slice().reverse().slice(0,30).forEach(function(x){
      var isG=(x.type||DAYS[x.day].type)==='gym';
      h+='<div class="hist"><span class="hd'+(isG?'':' h')+'">'+(isG?x.day:'•')+'</span><span class="hb"><b>'+DAYS[x.day].t+' · '+dwd(x.s)+'</b>'+
        '<span>'+dur(x.f-x.s)+' · '+countSets(x)+' подх.'+(tonnage(x)?' · '+Math.round(tonnage(x))+' кг':'')+(x.kcal?' · '+x.kcal+' ккал':'')+'</span>'+
        (x.note?'<span style="color:var(--dim);font-family:inherit">'+esc(x.note)+'</span>':'')+'</span></div>';
    });
    h+='<button class="big dan gap" data-a="dellast">Удалить последнюю тренировку</button>';
  }

  h+='<h4>Данные</h4><p class="sub">Хранятся только в этом браузере, на телефоне. Никуда не отправляются. Делай копию хотя бы раз в месяц.</p>'+
     '<div class="btns"><button class="sm" data-a="exp">Копия (JSON)</button><button class="sm" data-a="expcsv">Таблица (CSV)</button>'+
     '<button class="sm" data-a="expai">Отчёт для Claude</button><button class="sm" data-a="imp">Восстановить</button></div>'+
     '<textarea class="io" id="io" placeholder="Сюда попадёт выгрузка — выдели и скопируй. Чтобы восстановить, вставь сюда сохранённый JSON и нажми «Восстановить»."></textarea>'+
     '<button class="big dan gap" data-a="wipe">Стереть все данные</button>';
  v.innerHTML=h;
  bindPlan();
}
function planRow(k,n){
  return '<tr><td>'+n+'</td><td style="width:120px"><span class="fld"><button data-a="pl" data-k="'+k+'" data-s="-1">−</button>'+
    '<input type="text" inputmode="numeric" id="p_'+k+'" value="'+S.plan[k]+'" style="height:34px"><button data-a="pl" data-k="'+k+'" data-s="1">+</button></span></td></tr>';
}
function bindPlan(){
  document.querySelectorAll('[data-a="pl"]').forEach(function(b){
    b.addEventListener('click',function(){
      var k=b.dataset.k,nv=Math.max(0,Math.min(14,S.plan[k]+ +b.dataset.s));
      S.plan[k]=nv;save();renderStat();
    });
  });
}

/* ============ ЭКСПОРТ ============ */
function dump(){return JSON.stringify({v:2,log:S.log,body:S.body,custom:S.custom,setsOv:S.setsOv,plan:S.plan});}
function dl(name,text,mime){
  try{
    var b=new Blob([text],{type:mime||'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');
    a.href=u;a.download=name;document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(u);a.remove();},400);return true;
  }catch(e){return false;}
}
function doExport(){var t=dump();document.getElementById('io').value=t;dl('zal-'+iso(Date.now())+'.json',t);toast('Копия в поле ниже. Если файл не скачался — скопируй текст');}
function doCsv(){
  var rows=['Дата;День;Тип;Упражнение;Подход;Вес;Повторы'];
  S.log.slice().sort(function(a,b){return a.s-b.s;}).forEach(function(x){
    Object.keys(x.e).forEach(function(k){
      x.e[k].forEach(function(s,i){
        rows.push([iso(x.s),DAYS[x.day]?DAYS[x.day].t:x.day,(x.type||'gym'),(EX[k]?EX[k].name:k),i+1,String(s.w).replace('.',','),s.r].join(';'));
      });
    });
  });
  rows.push('');rows.push('Дата;'+BODY.map(function(f){return f.n+', '+f.u;}).join(';'));
  S.body.slice().sort(function(a,b){return a.d<b.d?-1:1;}).forEach(function(r){
    rows.push([r.d].concat(BODY.map(function(f){return r[f.k]!==undefined?String(r[f.k]).replace('.',','):'';})).join(';'));
  });
  var csv='\ufeff'+rows.join('\n');
  document.getElementById('io').value=csv;
  dl('zal-tablica-'+iso(Date.now())+'.csv',csv,'text/csv');
  toast('CSV в поле ниже. Открывается в Excel и Google Таблицах');
}
function doAi(){
  var L=[];
  L.push('ОТЧЁТ ПО ТРЕНИРОВКАМ, '+iso(Date.now()));
  L.push('Тренировок всего: '+S.log.length+'. План: зал '+S.plan.gym+'/нед, дома '+(S.plan.mob+S.plan.core+S.plan.wheel+S.plan.prio)+'/нед.');
  var si=strengthIndex();
  if(si.length)L.push('Индекс силы: '+si[0].y+' → '+si[si.length-1].y);
  L.push('');
  L.push('ПРОГРЕСС ПО УПРАЖНЕНИЯМ (дата: подходы вес×повт)');
  var ids=[];Object.keys(DAYS).forEach(function(k){DAYS[k].ex.forEach(function(x){if(ids.indexOf(x.id)<0)ids.push(x.id);});});
  ids.forEach(function(id){
    var m=EX[id],rr=[];
    S.log.forEach(function(x){
      var e=x.e[id];if(!e||!e.length)return;
      rr.push(dstr(x.s)+': '+e.map(function(s){return m.noW?s.r:fmtW(s.w)+'×'+s.r;}).join(' '));
    });
    if(rr.length)L.push('• '+m.name+' ['+m.grp+']\n   '+rr.slice(-8).join('\n   '));
  });
  L.push('');
  L.push('ЗАМЕРЫ ТЕЛА');
  S.body.slice().sort(function(a,b){return a.d<b.d?-1:1;}).slice(-10).forEach(function(r){
    L.push('  '+r.d+': '+BODY.filter(function(f){return r[f.k]!==undefined;}).map(function(f){return f.n+' '+fmtW(r[f.k])+f.u;}).join(', '));
  });
  L.push('');
  L.push('НЕДЕЛИ (статус: g=по плану, y=пропущено дома, r=пропущен зал)');
  var seen={};
  S.log.slice().reverse().forEach(function(x){
    var wk=weekKey(x.s);if(seen[wk])return;seen[wk]=1;
    var ss=S.log.filter(function(y){return weekKey(y.s)===wk;});
    var g=ss.filter(function(y){return (y.type||DAYS[y.day].type)==='gym';}).length;
    L.push('  неделя с '+dstr(wk)+': зал '+g+', дома '+(ss.length-g)+', ккал '+ss.reduce(function(a,y){return a+(y.kcal||0);},0)+' — '+weekStatus(wk));
  });
  var t=L.join('\n');
  document.getElementById('io').value=t;
  dl('otchet-'+iso(Date.now())+'.txt',t,'text/plain');
  toast('Отчёт в поле ниже. Выдели, скопируй и вставь мне в чат');
}
function doImport(){
  var t=document.getElementById('io').value.trim();
  if(!t){toast('Вставь JSON-копию в поле ниже');return;}
  try{
    var d=JSON.parse(t);
    if(!d||!Array.isArray(d.log))throw 0;
    S.log=d.log;S.body=d.body||[];S.custom=d.custom||{};S.setsOv=d.setsOv||{};
    if(d.plan)S.plan=d.plan;
    save();renderStat();toast('Загружено: '+S.log.length+' тренировок, '+S.body.length+' замеров');
  }catch(e){toast('Не похоже на копию данных');}
}

/* ============ НАВИГАЦИЯ ============ */
function switchView(n){
  ['work','prog','body','stat'].forEach(function(x){
    document.getElementById('v-'+x).classList.toggle('on',x===n);
    document.querySelector('.nav [data-v="'+x+'"]').setAttribute('aria-current',x===n?'true':'false');
  });
  if(n==='prog')renderProg();
  if(n==='body')renderBody();
  if(n==='stat')renderStat();
  if(n==='work')renderWork();
  window.scrollTo(0,0);
}

/* ============ СТАРТ ============ */
store.get('gym:v2').then(function(d){
  if(!d) return store.get('gym:v1').then(function(o){
    if(o){S.log=o.log||[];S.body=o.body||[];}
    boot(true);
  });
  S.active=d.active||null;S.log=d.log||[];S.body=d.body||[];
  S.custom=d.custom||{};S.setsOv=d.setsOv||{};
  if(d.plan)S.plan=d.plan;
  boot(false);
});
function boot(migrated){
  if(S.active&&!S.active.w)S.active.w={};
  renderWork();
  if(S.active){setClock(S.active.s);toast('Незавершённая тренировка восстановлена');}
  else if(migrated&&S.log.length)toast('Данные из прошлой версии перенесены');
}
</script>
</body>
</html>
