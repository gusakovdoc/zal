<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#090C10">
<title>Зал</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#090C10; --surf:#141A21; --card:#151B23; --card2:#1A222B; --line:#242E39;
  --tx:#EDF0EE; --mut:#8D97A2; --dim:#5A6570;
  --ok:#55BC8A; --ok-bg:#102820; --ok-br:#2C6249;
  --dat:#68ACEC; --wu:#6E7B85;
  --warn:#E2AB4E; --warn-bg:#2B2415;
  --stop:#E45B49; --stop-bg:#2C1816;
  --adv:#A78BFA; --adv-bg:#1B1730;
  --acc:#F1813E; --acc-bg:#2B1A11;  /* оранжевый акцент: отсчёт, рекорд, совет дня */
  --ink:#080B0E;                    /* текст на цветной заливке */
  --r:14px; --r-s:10px; --r-x:7px;  /* радиусы: карточка, элемент, мелочь */
  --sh:0 1px 2px rgba(0,0,0,.5), 0 6px 18px -10px rgba(0,0,0,.8);
  --edge:inset 0 1px 0 rgba(255,255,255,.045);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--tx);font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5;padding-bottom:84px;overscroll-behavior-y:none;
  /* мягкое свечение сверху, чтобы фон не был плоским листом */
  background:var(--bg);
  background-image:radial-gradient(120% 55% at 50% -10%, rgba(85,188,138,.09), transparent 62%),
                   radial-gradient(90% 45% at 100% 0%, rgba(104,172,236,.055), transparent 60%),
                   radial-gradient(70% 40% at 0% 4%, rgba(241,129,62,.05), transparent 62%);
  background-attachment:fixed}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}
button{font-family:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--dat);outline-offset:2px}

.top{position:sticky;top:0;z-index:30;background:rgba(9,12,16,.72);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);border-bottom:1px solid rgba(36,46,57,.8)}
.top-in{max-width:640px;margin:0 auto;padding:11px 14px;display:flex;align-items:center;gap:12px}
.ttl{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:28px;letter-spacing:-.005em;flex:1;line-height:.98}
.ttl small{display:block;font-family:"IBM Plex Sans",sans-serif;font-weight:400;font-size:12px;color:var(--mut);letter-spacing:0;margin-top:3px}
.clock{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:22px;font-variant-numeric:tabular-nums;color:var(--ok)}
.clock.off{color:var(--dim)}
.clock.pause{color:var(--warn)}
.restbtn{background:var(--surf);border:1px solid var(--line);border-radius:999px;padding:8px 15px;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:15px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);flex:0 0 auto;min-width:82px;box-shadow:var(--edge)}
/* идёт отсчёт — оранжевый, «пора» — зелёный: ждать против действовать */
.restbtn.run{background:var(--acc);border-color:var(--acc);color:var(--ink);font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:16px;letter-spacing:0;padding:8px 13px;box-shadow:0 0 0 4px rgba(241,129,62,.16)}
.restbtn.fire{background:var(--ok);border-color:var(--ok);color:var(--ink);box-shadow:0 0 0 4px rgba(85,188,138,.18)}
.row.timing{background:rgba(226,171,78,.16);box-shadow:inset 0 0 0 1px var(--warn)}
.chk.timing{background:var(--warn);border-color:var(--warn);color:var(--ink);font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:13px}
.tips{margin:0 0 18px}
/* скругление теперь со всех сторон, акцентная полоса слева осталась */
.tip{background:var(--card);border-left:3px solid var(--line);border-radius:var(--r-s);padding:11px 14px;margin-bottom:8px;font-size:14.5px;line-height:1.45;color:var(--mut);box-shadow:var(--sh),var(--edge)}
.tip b{color:var(--tx);font-weight:600}
.tip.todo{border-left-color:var(--warn)}
.tip.good{border-left-color:var(--ok)}
.tip.fact{border-left-color:var(--acc)}

.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(20,26,33,.82);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);border-top:1px solid rgba(36,46,57,.9);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.nav button{position:relative;flex:1;background:none;border:0;padding:13px 2px 13px;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:13.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.nav button[aria-current="true"]{color:var(--acc)}
/* активная вкладка отмечена короткой чертой по центру, а не во всю ширину */
.nav button::after{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:0;height:2px;border-radius:0 0 3px 3px;background:var(--acc);transition:width .18s}
.nav button[aria-current="true"]::after{width:26px;box-shadow:0 0 10px rgba(241,129,62,.6)}

.view{display:none;padding-top:16px}
.view.on{display:block}

.motd{background:var(--card);border-left:3px solid var(--ok);border-radius:var(--r-s);padding:11px 13px;margin-bottom:18px;font-size:14.5px;color:var(--mut);line-height:1.45}
.pick{display:grid;gap:10px;margin-bottom:22px}
.pick button{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;text-align:left;display:flex;align-items:center;gap:14px;width:100%;box-shadow:var(--sh),var(--edge);transition:transform .12s,border-color .12s}
.pick button:active{transform:scale(.985);border-color:var(--dim)}
.pick.home button{padding:14px 16px}
.pick .dn{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:31px;line-height:1;color:var(--ok);width:32px;flex:0 0 auto}
.pick.home .dn{font-size:22px;color:var(--dat);width:26px}
.pick .dd{flex:1;min-width:0}
.pick .dd b{display:block;font-weight:600;font-size:16.5px;margin-bottom:2px;letter-spacing:-.005em}
.pick .dd span{font-size:13px;color:var(--mut)}
.pick .dd em{display:block;font-style:normal;font-size:12.5px;color:var(--dim);margin-top:3px}
/* ДОМА · ЗАЛ · КОРТ — оранжевые: это опоры, по которым бегает глаз */
.hdr{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--acc);margin:0 0 9px;padding-left:2px;display:flex;align-items:center;gap:9px}
.hdr::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(241,129,62,.35),transparent)}

.ex{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:11px;overflow:hidden;box-shadow:var(--sh),var(--edge)}
.ex.done{background:var(--ok-bg);border-color:var(--ok-br)}
.exh{padding:13px 14px 9px;display:flex;gap:11px;align-items:flex-start}
.exn{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:21px;color:var(--acc);width:20px;flex:0 0 auto;line-height:1.15;padding-top:2px}
.ex.done .exn{color:var(--ok)}
.ext{flex:1;min-width:0}
.ext h3{font-size:16.5px;font-weight:600;margin:0 0 3px;line-height:1.25}
.tgt{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:15px;letter-spacing:.05em;text-transform:uppercase;color:var(--dat)}
.grp{color:var(--dim);margin-left:7px}
.pr{display:inline-block;margin-left:6px;background:var(--acc);color:var(--ink);font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:12px;letter-spacing:.08em;padding:2px 7px;border-radius:999px;vertical-align:1px;box-shadow:0 0 14px rgba(241,129,62,.55)}
.hint{font-size:13.5px;color:var(--mut);line-height:1.4;padding:0 14px 7px 45px;margin:0}
.e1{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--dat);padding:0 14px 8px 45px}
.mynote{background:rgba(104,172,236,.09);border-left:2px solid var(--dat);margin:0 14px 9px 45px;padding:7px 10px;font-size:13.5px;color:var(--tx);border-radius:var(--r-x)}

.tech-btn{display:block;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:9px 13px;text-align:left;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:14px;letter-spacing:.11em;text-transform:uppercase;color:var(--mut)}
.tech-btn::after{content:" ▾";color:var(--dim)}
.tech-btn[aria-expanded="true"]::after{content:" ▴"}
.tech{display:none;padding:2px 13px 14px;border-top:1px solid var(--line);font-size:14.5px}
.tech.open{display:block}
.tech .lb{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:13px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);margin:13px 0 5px}
.tech ol{margin:0;padding-left:19px}
.tech ol li{margin-bottom:6px}
.tech ul{margin:0;padding:0;list-style:none}
.tech ul li{padding-left:15px;margin-bottom:6px;position:relative}
.tech ul li::before{content:"";position:absolute;left:0;top:10px;width:7px;height:1.5px;background:var(--dat)}
.tech .stop{background:var(--stop-bg);border-left:3px solid var(--stop);padding:10px 12px;margin-top:13px;border-radius:var(--r-x)}
.tech .stop .lb{color:var(--stop);margin:0 0 3px}
.tech .stop p{margin:0}
.tech .nt{margin:13px 0 0;color:var(--mut);font-size:13.5px}
.rest{display:inline-block;background:var(--surf);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--tx);margin-top:4px}

.sets{padding:2px 10px 5px}
.sect{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);opacity:.85;padding:8px 4px 3px}
.row{display:flex;align-items:center;gap:6px;padding:5px 4px;border-radius:var(--r-s)}
.row.filled{background:rgba(85,188,138,.11)}
.row.wu.filled{background:rgba(110,123,133,.13)}
.row.warn{background:var(--stop-bg);box-shadow:inset 0 0 0 1px var(--stop)}
.si{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--dim);width:19px;flex:0 0 auto;text-align:center}
.row.wu .si{color:var(--wu)}
.fld{display:flex;align-items:center;flex:1;min-width:0}
.fld button{background:var(--surf);border:1px solid var(--line);color:var(--mut);width:29px;height:40px;font-size:17px;line-height:1;flex:0 0 auto;padding:0;font-family:"IBM Plex Mono",monospace}
.fld button:first-of-type{border-radius:var(--r-s) 0 0 var(--r-s)}
.fld button:last-of-type{border-radius:0 var(--r-s) var(--r-s) 0}
.fld button:active{background:var(--card2);color:var(--tx)}
.fld input{flex:1;min-width:0;width:100%;height:40px;background:var(--surf);border:1px solid var(--line);border-left:0;border-right:0;color:var(--tx);font-family:"IBM Plex Mono",monospace;font-weight:500;font-size:16px;text-align:center;padding:0 2px}
.fld input:focus{outline:none;border-color:var(--dat);background:#1C242D;box-shadow:0 0 0 3px rgba(104,172,236,.13)}
.fld input:disabled,.fld button:disabled{opacity:.55;color:var(--mut)}
.un{font-family:"Barlow Condensed",sans-serif;font-size:12.5px;color:var(--dim);width:15px;flex:0 0 auto}
.chk{width:42px;height:40px;flex:0 0 auto;border-radius:var(--r-s);background:var(--surf);border:1px solid var(--line);font-size:17px;color:var(--dim);padding:0;line-height:1;transition:transform .1s}
.chk:active{transform:scale(.93)}
.chk.on{background:var(--ok);border-color:var(--ok);color:var(--ink);font-weight:700;box-shadow:0 0 14px rgba(85,188,138,.35)}
.row.wu .chk.on{background:var(--wu);border-color:var(--wu);color:var(--ink);box-shadow:none}
.prev{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--dim);padding:0 4px 3px 29px}
.wmsg{font-size:12.5px;color:var(--stop);padding:1px 4px 5px 29px}
.setbtns{display:flex;flex-wrap:wrap;gap:7px;padding:7px 4px 9px}
.setbtns button{background:var(--surf);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}

.big{display:block;width:100%;border:0;border-radius:var(--r);padding:16px;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:20px;letter-spacing:.09em;text-transform:uppercase;transition:transform .12s}
.big:active{transform:scale(.99)}
.big.go{background:linear-gradient(180deg,#63C795,var(--ok));color:var(--ink);box-shadow:0 6px 20px -8px rgba(85,188,138,.75),var(--edge)}
.big.fin{background:var(--surf);color:var(--tx);border:1px solid var(--line);box-shadow:var(--edge)}
.big.dan{background:none;color:var(--stop);border:1px solid rgba(228,91,73,.45);font-size:15px;padding:12px}
.big.armed{background:var(--stop);color:#fff;border-color:var(--stop)}
.gap{margin-top:12px}
.sm{display:inline-block;width:auto;padding:9px 15px;font-size:14px;background:var(--surf);border:1px solid var(--line);border-radius:999px;font-family:"Barlow Condensed",sans-serif;font-weight:600;letter-spacing:.06em;text-transform:uppercase;box-shadow:var(--edge)}
.sm:active{background:var(--card2)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}

h4{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:23px;margin:26px 0 10px;letter-spacing:-.005em}
h4:first-child{margin-top:0}
.sub{font-size:13.5px;color:var(--mut);margin:-6px 0 12px;line-height:1.45}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:7px}
.kpi{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r-s);padding:12px 11px;box-shadow:var(--sh),var(--edge)}
.kpi b{display:block;font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:22px;line-height:1.1;margin-bottom:3px;letter-spacing:-.02em}
.kpi span{font-size:11.5px;color:var(--mut);line-height:1.25;display:block}
.kpi.hl b{color:var(--ok)}
.bar{margin-bottom:10px}
.bar-t{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;margin-bottom:5px}
.bar-t b{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:15px}
.bar-t b i{font-style:normal;color:var(--dim);font-size:12.5px;font-weight:400}
.track{height:9px;background:var(--surf);border-radius:999px;overflow:hidden;display:flex;box-shadow:inset 0 1px 2px rgba(0,0,0,.45)}
.track i{display:block;height:100%;background:linear-gradient(90deg,var(--dat),#8FC4F2);border-radius:999px}
.track i.pw{background:var(--line)}

select,input[type=date],input[type=number],input.txt{width:100%;background:var(--surf);color:var(--tx);border:1px solid var(--line);border-radius:var(--r-s);padding:12px 12px;font-family:inherit;font-size:15px;margin-bottom:12px;box-shadow:var(--edge)}
select:focus,input.txt:focus,input[type=date]:focus{outline:none;border-color:var(--dat);box-shadow:0 0 0 3px rgba(104,172,236,.13)}
.chart{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 11px 9px;margin-bottom:12px;box-shadow:var(--sh),var(--edge)}
.chart h5{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:14px;letter-spacing:.11em;text-transform:uppercase;color:var(--mut);margin:0 0 8px;padding:0 3px}
.chart svg{display:block;width:100%;height:auto}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);text-align:left;padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
td.n{font-family:"IBM Plex Mono",monospace;font-size:13.5px;color:var(--mut)}
.hist{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line);align-items:baseline}
.hist .hd{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:18px;color:var(--ok);width:22px;flex:0 0 auto}
.hist .hd.h{color:var(--dat);font-size:15px}
.hist .hb{flex:1;min-width:0}
.hist .hb b{display:block;font-weight:500;font-size:15px}
.hist .hb span{font-size:12.5px;color:var(--mut);font-family:"IBM Plex Mono",monospace}
.empty{color:var(--dim);font-size:14.5px;padding:22px 0;text-align:center;line-height:1.6}

/* календарь */
.cal{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px;box-shadow:var(--sh),var(--edge)}
.calnav{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.calnav b{flex:1;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:19px;text-align:center;text-transform:capitalize}
.calnav button{background:var(--surf);border:1px solid var(--line);border-radius:999px;width:34px;height:32px;color:var(--mut);font-size:16px;padding:0}
.calrow{display:grid;grid-template-columns:repeat(7,1fr) 30px;gap:3px;align-items:center}
.calrow.head span{font-family:"Barlow Condensed",sans-serif;font-size:12px;color:var(--dim);text-align:center;text-transform:uppercase;letter-spacing:.06em;padding-bottom:2px}
.cd{aspect-ratio:1;border-radius:var(--r-x);background:var(--surf);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--mut);position:relative;min-height:34px}
.cd.out{opacity:.26}
.cd.today{box-shadow:inset 0 0 0 1.5px var(--tx)}
.cd .dots{display:flex;gap:2px;margin-top:2px;height:5px}
.cd .dots i{width:5px;height:5px;border-radius:50%;display:block}
.cd .dots i.g{background:var(--ok);box-shadow:0 0 6px rgba(85,188,138,.7)}
.cd .dots i.h{background:var(--dat);box-shadow:0 0 6px rgba(104,172,236,.6)}
.wst{width:26px;height:26px;border-radius:var(--r-x);font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;color:var(--ink);border:0;padding:0}
.wst.g{background:var(--ok)} .wst.y{background:var(--warn)} .wst.r{background:var(--stop);color:#fff} .wst.n{background:var(--line);color:var(--dim)}
.leg{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--mut);margin-top:10px}
.leg span{display:flex;align-items:center;gap:5px}
.leg i{width:9px;height:9px;border-radius:3px;display:block}

/* модалка */
.mask{position:fixed;inset:0;background:rgba(5,7,10,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:50;display:none;align-items:flex-end;justify-content:center;padding:0}
.mask.on{display:flex}
.modal{background:linear-gradient(180deg,var(--card),var(--bg) 220px);border-top:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;padding:20px 16px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -18px 50px -20px rgba(0,0,0,.9)}
/* «ручка» сверху — подсказка, что лист тянется */
.modal::before{content:"";display:block;width:38px;height:4px;border-radius:999px;background:var(--line);margin:-6px auto 14px}
.modal h3{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:26px;margin:0 0 4px;letter-spacing:-.005em}
.modal p.sub{margin:0 0 16px}
.mlab{font-size:14px;font-weight:500;margin-bottom:4px;display:block}
.mlab em{font-style:normal;color:var(--dim);font-size:12.5px;display:block}
.done-list{margin:0 0 16px;padding:0;list-style:none}
.done-list li{display:flex;gap:9px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.done-list li b{font-family:"IBM Plex Mono",monospace;font-weight:600;color:var(--ok);flex:0 0 auto}

.bf{margin-bottom:11px}
.bf label{display:block;font-size:14px;font-weight:500}
.bf label em{display:block;font-style:normal;font-size:11.5px;color:var(--dim);line-height:1.35;margin-top:1px}

textarea{width:100%;background:var(--surf);color:var(--tx);border:1px solid var(--line);border-radius:var(--r-s);padding:11px;font-family:inherit;font-size:14.5px;line-height:1.45;margin-bottom:10px;resize:vertical}

.pick.home .dn.fr{font-size:19px;width:44px;color:var(--dat)}
.pick .dn.fr.ok{color:var(--ok)}
.pick .dn.fr.miss{color:var(--warn)}

.exfold{display:flex;width:100%;background:none;border:0;padding:12px 14px;text-align:left;gap:11px;align-items:center}

.exfold .ext h3{margin:0 0 2px}
.exfold .fsum{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foldi{color:var(--dim);font-size:13px;flex:0 0 auto}

/* авто-ход: одна галка на всю тренировку */
.autotop{display:inline-flex;align-items:center;gap:8px;background:var(--surf);border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 6px;margin:0 0 12px;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:14px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);box-shadow:var(--edge)}
.autotop .ab{width:24px;height:24px;border-radius:999px;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--dim);flex:0 0 auto}
.autotop.on{color:var(--tx);border-color:var(--ok-br)}
.autotop.on .ab{background:var(--ok);border-color:var(--ok);color:var(--ink);font-weight:700}

/* заголовок раскрытого упражнения — кнопка сворачивания */
button.exh{width:100%;background:none;border:0;text-align:left;font:inherit;color:inherit}
button.exh .foldi{align-self:flex-start;padding-top:3px}

/* сторона вместо номера подхода */
.si.sd{color:var(--acc);font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:14px;letter-spacing:.04em}

.phint{background:rgba(85,188,138,.10);border-left:2px solid var(--ok);margin:0 14px 9px 45px;padding:7px 10px;font-size:13px;color:var(--ok);border-radius:var(--r-x)}

.calrow.sel{background:rgba(104,172,236,.13);border-radius:var(--r-x)}

.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-size:14px}

.kv.tot{border-top:1px solid var(--line);margin-top:4px;padding-top:8px}
.kv.tot b{color:var(--ok);font-size:16px}
.note-s{font-size:13px;color:var(--mut);line-height:1.45;margin:9px 0 0}

/* питание */
.macro{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:12px 0 4px}

.tgtbig{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:40px;color:var(--ok);line-height:1;letter-spacing:-.03em;text-shadow:0 0 30px rgba(85,188,138,.35)}

/* смахиваемые карточки: горизонталь перехватываем, вертикальную прокрутку оставляем */
[data-tip]{touch-action:pan-y}
/* совет дня — единственная карточка с тёплой подложкой, тон слабый,

.tip.fact{background:linear-gradient(100deg,rgba(241,129,62,.09),var(--card) 58%)}
.tip.fact b{display:block;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:13px;letter-spacing:.13em;text-transform:uppercase;color:var(--acc);margin-bottom:4px}

@media (max-width:400px){
  .fld button{width:25px}
  .fld input{font-size:15px;padding:0 1px}

var store=(function(){
  var ws=(typeof window!=='undefined')&&window.storage&&typeof window.storage.get==='function';
  var LS='local'+'Storage';
  return{
    get:function(k){
      if(ws)return window.storage.get(k,false).then(function(r){return r&&r.value?JSON.parse(r.value):null;}).catch(function(){return null;});
      return new Promise(function(res){try{var v=window[LS].getItem(k);res(v?JSON.parse(v):null);}catch(e){res(null);}});
    },
    set:function(k,v){
      var s=JSON.stringify(v);
      if(ws)return window.storage.set(k,s,false).catch(function(){});
      return new Promise(function(res){try{window[LS].setItem(k,s);}catch(e){}res();});
    }

})();

 how:['Хват чуть шире плеч.','Начинай с опускания лопаток, потом сгибай руки.','Вверху грудь к перекладине. Внизу руки полностью выпрямляются, лопатки отпускаются.','Опускание контролируемое, 2 сек — здесь строится большая часть результата.'],
 watch:['Ноги не выбрасывай вперёд, не киппингуй — это рывок по пояснице.'],
 note:'Схема против застоя: 1-й подход до отказа, 2-й и 3-й — фиксированные 8 чисто. Дошёл до 13–14 в первом — вешай 5 кг.'},
incline_curl:{name:'Подъём на бицепс на наклонной',grp:'Бицепс',start:14,step:2,hand:1,e1:1,rest:'90 сек',
 wu:[{p:.5,r:12}],
 hint:'Руки строго вертикально вниз, за линией корпуса.',
 how:['Наклон скамьи 45–60°, спина прижата.','Руки висят строго вертикально вниз, за линией корпуса. Вперёд не выводить — это убивает смысл упражнения.','Плечо неподвижно, двигается только предплечье.','Внизу руки полностью выпрямляются. Опускание 3 сек.'],
 watch:['Вверху не доводи предплечье до вертикали.'],
 note:'Твоё лучшее упражнение на бицепс: длинная головка максимально растянута.'},
leg_curl:{name:'Сгибание ног сидя',grp:'Ноги',start:45,step:5,e1:1,rest:'90 сек',
 wu:[{p:.55,r:15}],
 hint:'Таз прижат. Валик над ахиллом, не на икре.',
 how:['Валик над ахиллом, не на икре.','Колено совпадает с осью вращения тренажёра, спинка отрегулирована.','Сгибание до упора, короткая пауза.','Разгибание 3 сек, вес не бросать.'],
 watch:['Таз не отрывать — при отрыве нагрузка уходит в поясницу.'],
 note:'Сильные бицепсы бедра — прямая профилактика травм в паделе.'},
rear_delt:{name:'Разведение рук сидя (задние дельты)',grp:'Дельты',start:32,step:5,rest:'60 сек',
 wu:[{p:.5,r:15}],
 hint:'Лёгкий вес, 15–20 повторов. Вести локтями.',
 how:['Грудью в спинку, руки на рукоятях.','Разводи, ведя локтями, а не кистями.','В конце сведи лопатки, пауза 1 сек.','Возврат медленный, до касания не расслабляйся.'],
 watch:['Не помогай инерцией и трапециями — здесь важен лёгкий вес.'],
 note:'Работает на баланс плеча: падел и сидячая работа тянут плечи вперёд.'},
hanging_leg:{name:'Подъём ног в висе',grp:'Пресс',bw:1,start:0,step:2,rest:'60–90 сек',
 hint:'В верхней точке подкручивай таз к себе. Без раскачки.',
 how:['Повисни, стабилизируйся. Ноги почти прямые.','В верхней точке сознательно подкручивай таз к себе — без этого работают только сгибатели бедра.','Опускание 3 сек.'],
 watch:['Качает — повисни заново и начни с нуля.','Хват не должен быть ограничителем: используй лямки или упор на локти.'],
 note:'15/15/15 чисто → зажимай гантель 4 кг между стопами.'},
pallof:{name:'Pallof press',grp:'Кор',start:15,step:5,repdef:11,rest:'45–60 сек',
 hint:'Стоишь боком к блоку. Выжимаешь и удерживаешь, корпус неподвижен.',
 how:['Встань боком к блоку, рукоять двумя руками у груди.','Выжми руки вперёд и удерживай 2–3 сек. Блок тянет тебя в поворот — ты сопротивляешься.','Вернись к груди. 10–12 повторов. Другая сторона — следующий подход.'],
 watch:['Корпус не разворачивается ни на градус. Разворачивает — вес великоват.','Ноги на ширине плеч, колени мягкие, таз нейтрален.'],
 note:'Противодействие ротации без самой ротации. То, чем должны были быть русские повороты, но без нагрузки на диски.'},

/* --- ДОМ: МОБИЛЬНОСТЬ --- */
h_hip:{name:'Сгибатели бедра в выпаде',side:1,grp:'Мобильность',noW:1,unit:'сек',repdef:60,repstep:15,rest:'без паузы',
 hint:'Сначала подкрути таз, потом подай вес вперёд. 60 сек на сторону.',
 how:['Встань на одно колено, под колено полотенце. Передняя нога согнута под 90°.','Сначала подкрути таз: копчик вперёд-вверх, сожми ягодицу задней ноги.','Удерживая таз, подай вес вперёд. Смещение 2–3 см, не больше.','60 сек. Вторая нога — следующий подход.'],
 watch:['Тянуть должно спереди бедра задней ноги, у самого паха.','Корпус вертикально, не наваливайся.'],
 stop:'Тянет в пояснице — таз не подкручен. Начни заново.'},
h_tspine:{name:'Грудной отдел на валике',grp:'Мобильность',noW:1,unit:'сек',repdef:20,repstep:10,rest:'без паузы',
 hint:'Валик под лопатками, таз прижат к полу. 3 позиции по 20 сек.',
 how:['Сверни полотенце в валик диаметром ~10 см, положи поперёк спины под нижние края лопаток.','Колени согнуты, стопы на полу, таз прижат.','Руки за голову, локти к лицу. Разгибайся назад через валик. 20 сек.','Сдвинь валик выше на ширину ладони — ещё 20 сек. И ещё раз выше.'],
 watch:['Таз не отрывается от пола.','Рёбра не выталкивай вперёд.'],
 stop:'Почувствовал поясницу — валик слишком низко, сдвинь выше.'},
h_book:{name:'Открытая книга',side:1,grp:'Мобильность',noW:1,repdef:8,rest:'без паузы',
 hint:'Колени прижаты, разворачивается только грудная клетка.',
 how:['Ляг на бок, колени согнуты 90°, под верхнее колено подушка.','Руки вытянуты вперёд, ладонь на ладони.','На выдохе раскрывай верхнюю руку назад, взгляд за кистью.','Задержись 2 сек, вернись. 8 раз. Другая сторона — следующий подход.'],
 watch:['Колени не отрываются друг от друга.','Веди грудной клеткой, а не тянись рукой.']},
h_door:{name:'Грудные в дверном проёме',side:1,grp:'Мобильность',noW:1,unit:'сек',repdef:45,repstep:15,rest:'без паузы',
 hint:'Локоть на уровне плеча, 90°. Тянет у подмышки, не в суставе.',
 how:['Встань в проём, предплечье к косяку, локоть на уровне плеча, угол 90°.','Небольшой шаг вперёд той же ногой.','Мягко поверни корпус в сторону от руки. 45 сек. Вторая рука — следующий подход.'],
 watch:['Голова не выдвигается вперёд.','Растяжение по передней поверхности груди, у подмышки.'],
 stop:'Щиплет в переднюю часть плеча — опусти локоть на 10–15 см ниже.'},
h_glute:{name:'Фигура 4 лёжа',side:1,grp:'Мобильность',noW:1,unit:'сек',repdef:45,repstep:15,
 hint:'Лодыжка на колене, подтягиваешь бедро к себе. Поясница прижата.',
 how:['Ляг на спину, колени согнуты, стопы на полу.','Положи лодыжку правой ноги на левое колено — получится «четвёрка».','Просунь руки под левое бедро и подтяни его к груди.','Правым локтем мягко отводи правое колено от себя. 45 сек. Вторая нога — следующий подход.'],
 watch:['Тянет в глубине ягодицы и снаружи бедра.','Голова и плечи на полу, не тянись к ногам головой.','Поясница прижата — если отрывается, тяни бедро меньше.'],
 note:'Грушевидная и ягодичные забиваются от падела и сидячей работы. Их жёсткость тянет таз и грузит поясницу сильнее, чем задняя поверхность бедра.'},

/* --- ДОМ: КОР --- */
h_deadbug:{name:'Dead bug',grp:'Кор',noW:1,repdef:10,rest:'45 сек',
 hint:'Поясница прижата к полу — это единственный критерий амплитуды.',
 how:['Ляг на спину. Руки вертикально вверх, ноги подняты, колени 90°.','Прижми поясницу к полу и удерживай всё упражнение.','На выдохе медленно опусти правую руку за голову и левую ногу вниз.','Вернись, повтори на другую сторону. 3 сек туда, 3 обратно.'],
 watch:['Появился просвет под поясницей — ты зашёл дальше, чем держишь.'],
 stop:'Не гонись за амплитудой. Опускай ногу ровно настолько, насколько держится поясница.'},
h_birddog:{name:'Bird dog',grp:'Кор',noW:1,repdef:8,rest:'45 сек',
 hint:'Стакан воды на пояснице не должен пролиться.',
 how:['На четвереньках: кисти под плечами, колени под тазом.','Спина нейтральная — ни прогиба, ни округления.','Вытяни правую руку вперёд и левую ногу назад до параллели с полом.','Пауза 2 сек, вернись. 8 раз. Другая сторона — следующий подход.'],
 watch:['Таз не разворачивается.','Нога не выше линии корпуса.','Шея продолжает линию спины.']},
h_splank:{name:'Боковая планка',twoSide:1,grp:'Кор',start:0,step:2,unit:'сек',repdef:40,repstep:10,rest:'45 сек',
 hint:'Локоть под плечом, тело в одну линию. Вес — жилет.',
 how:['Ляг на бок, обопрись на локоть строго под плечом.','Подними таз — прямая линия от головы до стоп.','Верхняя рука на бедре. 40 сек. Вторая сторона — следующий подход.'],
 watch:['Плечо опорной руки не проваливается.','Таз в одной плоскости.'],
 note:'Легче — с колен. Тяжелее — жилет 8–10 кг дважды в неделю. Вес пиши в поле слева.'},
h_bridge:{name:'Ягодичный мостик',grp:'Кор',start:0,step:2,repdef:15,rest:'45 сек',
 hint:'Сначала подкрути таз, потом поднимай. Вес — жилет на бёдра.',
 how:['Ляг на спину, колени согнуты, стопы на ширине таза, пятки в 20 см от ягодиц.','Сначала подкрути таз, прижми поясницу. Только потом поднимай.','Вверху сожми ягодицы, пауза 2 сек.','Опустись, не расслабляясь до конца.'],
 watch:['Чувствуешь поясницу — не подкрутил таз или поднялся выше линии.','Сводит заднюю поверхность — подвинь стопы ближе.']},

/* --- ДОМ: РОЛИК --- */
h_wheel:{name:'Ролик с колен',grp:'Кор',start:0,step:2,repdef:8,rest:'90 сек',
 hint:'Таз подкручен, спина слегка округлена. Никогда не прогнута.',
 how:['Встань на колени, ролик хватом на ширине плеч, руки прямые.','Перед стартом подкрути таз, напряги пресс, спину слегка округли.','На вдохе выкатывайся, удерживая таз подкрученным.','Остановись до того, как таз начнёт раскручиваться. Возврат за счёт пресса, не руками.'],
 watch:['Спина не прогибается ни на миллиметр.','Плечи не уезжают к ушам.'],
 stop:'Почувствовал поясницу — подход окончен. Никакого «ещё один».',
 note:'Недели 1–2: 2 подхода × 6–8 на 50% амплитуды. С 3-й недели 3 × 8–12. Потом жилет 5–10 кг.'},

/* --- ДОМ: ПРИОРИТЕТ --- */
h_pushup:{name:'Отжимания на упорах в жилете',grp:'Грудь',start:0,step:2,repdef:12,bwf:.65,e1:1,rest:'90 сек',
 hint:'Опускаться ниже уровня ладоней — в этом смысл упоров.',
 how:['Упоры чуть шире плеч, кисти на уровне середины груди.','Тело в прямую линию: голова, таз, пятки.','Опускайся ниже уровня ладоней, внизу пауза 1 сек.','Вверх мощно, локти до конца не блокируй.'],
 watch:['Локти под 45° к корпусу, не на 90°.','Таз не провисает и не поднимается домиком.','Лопатки сводятся внизу и расходятся вверху.'],
 note:'15 повторов во всех трёх подходах → +2–3 кг в жилет.'},
h_curl:{name:'Сгибания на бицепс одной рукой',side:1,grp:'Бицепс',start:14,step:2,repdef:12,hand:1,e1:1,rest:'60 сек',
 hint:'Спиной к стене, локоть прижат. Чередуй руки без паузы.',
 how:['Встань спиной к стене, прижми лопатки и таз.','Гантель в одной руке, локоть прижат к боку.','Сгибай, не двигая локтем. Вверху не доводи предплечье до вертикали.','Опускай 3 сек. Одна рука — один подход, вторая рука — следующий.'],
 watch:['Локоть уехал вперёд — подход окончен.','Плечо не поднимается к уху.','Таз не отрывается от стены.']},
h_hammer:{name:'Молотковые сгибания',side:1,grp:'Бицепс',start:14,step:2,repdef:13,hand:1,e1:1,rest:'60 сек',
 hint:'Большой палец вверх, гантель строго вертикально.',
 how:['Позиция та же — спиной к стене, локоть прижат.','Хват нейтральный: большой палец вверх, ладонь к бедру.','Держи гантель вертикально всю амплитуду.','Опускание 3 сек. Каждая рука — отдельный подход.'],
 watch:['Кисть не заваливается и не проворачивается.'],
 note:'Упражнение на толщину руки. Гнаться за весом смысла нет.'},

/* --- ДОМ: СПИНА --- */
h_row:{name:'Тяга гантели в наклоне одной рукой',side:1,grp:'Спина',start:16,step:2,hand:1,repdef:12,e1:1,rest:'90 сек',
 hint:'Веди локтем к карману, а не тяни кистью вверх. Корпус неподвижен.',
 how:['Упрись свободной рукой и одноимённым коленом в диван или стул. Спина параллельна полу и нейтральна.','Гантель в свободной руке, рука прямая, плечо и лопатка внизу растянуты.','Начинай движение лопаткой: сведи её к позвоночнику, и только потом доводи локтем к карману.','Вверху пауза 1 сек, опускай 3 секунды до полного растяжения внизу.'],
 watch:['Корпус разворачивается вслед за рукой — самая частая ошибка, вес сразу вниз.','Локоть идёт вдоль корпуса, а не в сторону.','Поясница не круглится: таз чуть назад, грудь вперёд.','Чувствуешь только бицепс — значит тянешь рукой, а не спиной.'],
 note:'Добавлено, чтобы выровнять объём спины с грудью. Тяги и жимы должны идти примерно поровну, иначе плечи уезжают вперёд, а осанка за ними.'},

/* --- ДОМ: ТРИЦЕПС --- */
h_tri_oh:{name:'Разгибание из-за головы с гантелью',grp:'Трицепс',start:12,step:2,repdef:12,e1:1,rest:'60 сек',
 hint:'Локти у головы и неподвижны. Двигается только предплечье.',
 how:['Сядь или встань, рёбра вниз, пресс включён.','Возьми одну гантель двумя руками за верхний блин и подними над головой.','Опускай за голову до отчётливого растяжения трицепса, локти держи узко.','Внизу пауза 1 сек. Разгибай без рывка, вверху локти не блокируй.'],
 watch:['Локти разъезжаются в стороны — вес великоват.','Поясница уходит в прогиб — значит корпус компенсирует.'],
 note:'Растянутая позиция — главный стимул для длинной головки, самой крупной из трёх. Опускай 3 секунды.'},
h_kick:{name:'Обратные разгибания (кикбэк)',side:1,grp:'Трицепс',start:8,step:2,hand:1,repdef:14,e1:1,rest:'60 сек',
 hint:'Плечо параллельно полу и неподвижно. Работает только предплечье.',
 how:['Наклонись вперёд почти до параллели корпуса с полом, свободной рукой упрись в стену или бедро.','Плечо рабочей руки прижми к боку и подними до параллели с полом.','Разгибай руку назад до полного выпрямления, в конце короткая пауза и дожим.','Опускай 3 секунды, плечо не роняй.'],
 watch:['Плечо опускается — движение превратилось в мах.','Корпус разворачивается вслед за рукой.'],
 note:'Пиковое сокращение — дополняет разгибание из-за головы с другой стороны амплитуды. Вес тут маленький, это нормально.'},

/* --- ДОМ: ЛОКОТЬ, эпикондилит --- */
el_ecc:{name:'Эксцентрическое разгибание запястья',side:1,grp:'Локоть',start:1,step:.5,hand:1,repdef:15,rest:'60 сек',
 hint:'Главное упражнение протокола. Вверх помогаешь второй рукой, вниз — 4 секунды сам.',
 how:['Сядь, предплечье положи на бедро ладонью вниз, кисть свисает за колено.','Лёгкая гантель в рабочей руке. Второй рукой подними кисть в верхнее положение.','Убери помогающую руку и опускай кисть вниз 4 секунды, сопротивляясь весу. Вторая рука — следующий подход.','Снова подними второй рукой. Всё усилие только на опускании.'],
 watch:['Предплечье лежит на бедре и не отрывается.','Скорость опускания важнее веса — 4 секунды, не быстрее.'],
 stop:'Острая боль в наружном надмыщелке — прекрати. Тупое тянущее ощущение во время работы допустимо и ожидаемо.',
 note:'Эксцентрика — доказанное ядро лечения латерального эпикондилита. Начни с 1 кг, добавляй по 0,5 кг не чаще раза в две недели. Эффект появляется на 4–6 неделе, не раньше.'},
el_sup:{name:'Супинация и пронация с гантелью',side:1,grp:'Локоть',start:2,step:.5,hand:1,repdef:15,rest:'45 сек',
 hint:'Держи гантель за один конец, как молоток. Вращай медленно.',
 how:['Предплечье на бедре, кисть свисает, локоть согнут под 90°.','Возьми гантель за один конец — второй конец перевешивает.','Медленно поверни ладонь вверх до упора, пауза 1 сек.','Так же медленно поверни ладонью вниз. Одно повторение — это оба направления.'],
 watch:['Двигается только предплечье, плечо прижато к боку.','Если тяжело — перехвати гантель ближе к центру, рычаг станет короче.'],
 note:'Работает супинатор — вторая по частоте причина боли в наружном локте после разгибателей.'},

function setsOf(dayKey,item){

  /* Подход здесь — одна сторона, поэтому их число всегда чётное: при нечётном
     вторая сторона осталась бы недоделанной, а в подписях висело бы A, Б, A. */
  if(m&&m.side&&n%2)n++;

/* Числовая оценка подхода. Формула Эпли: вес × (1 + повторы/30).
   bw — вес тела целиком (подтягивания), bwf — его доля (отжимания ≈65%).
   Остальное — только снаряд: для гантельных считаем на одну руку. */
function setScore(w,r,m){
  var base=w+(m.bw?bodyW():(m.bwf?bodyW()*m.bwf:0));
  if(!base||!r)return 0;
  return base*(1+r/30);
}

function e1rm(w,r,m){return m.e1?setScore(w,r,m):0;}
